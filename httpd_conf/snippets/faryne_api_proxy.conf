# 轉給 Go 後端的 API 入口（location 內 include）
#
# 給 faryne.dev 的 /api/、/api-integration/，以及 galgame.tv、neko.maid.tw、steamloom.works 的 /api/ 共用，
# 避免四份設定各自漂移。proxy_pass 結尾的斜線會剝掉 location 前綴，例如 /api/galgame/brands → 後端 /galgame/brands。
# 使用的 server 要另外 include faryne_api_errors.conf（error_page 指向的具名 location 在那裡）。
# 部署位置：/etc/nginx/snippets/faryne_api_proxy.conf

proxy_pass http://faryne_api/;
proxy_http_version 1.1;

# 後端 Fiber 以 X-Real-IP 取使用者 IP（只信任 127.0.0.1）；橘雲網域的真實 IP 由 cloudflare_real_ip.conf 先還原
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 上傳（storyteller 資產等）上限
client_max_body_size 1024m;

proxy_connect_timeout 30s;
# AAS（agentic 多輪 tool-calling）單一步驟逾時已經拉到 180s
# （service/storyteller/ai_provider.go 的 aiProviderAgenticTimeout），最多到 8 步，
# 這裡放寬到 600s，避免 Go 那邊還在正常跑、卻先被 nginx 這層掐斷連線。
proxy_send_timeout 600s;
proxy_read_timeout 600s;

# 後端掛掉時回標準格式的錯誤（見 faryne_api_errors.conf）
error_page 502 = @api_gateway_down_502;
error_page 503 = @api_gateway_down_503;
error_page 504 = @api_gateway_down_504;
