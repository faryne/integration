    <!-- 色票、外框、通知列沿用站內通知 mockup，這裡只補新畫面用到的樣式 -->
    <style>
/* 色票與基礎框架沿用 oauth-mockup，僅保留這份 mockup 用得到的部分 */
:root {
  color-scheme: dark;
  --bg: #0d0f14; --paper: #151820; --paper-2: #1b1f29; --paper-3: #232834;
  --text: #f1f2f6; --muted: #9aa2b1; --disabled: #687080; --line: #2d3340;
  --primary: #aa91ff; --primary-soft: rgba(170, 145, 255, 0.14);
  --success: #66d5a0; --danger: #ff7f8b; --danger-soft: rgba(255, 127, 139, 0.14);
  --warning: #f4bd67; --blue: #69a9ff; --shadow: 0 18px 60px rgba(0, 0, 0, 0.36);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6fa; --paper: #ffffff; --paper-2: #f9f9fc; --paper-3: #eff1f6;
  --text: #20232b; --muted: #687080; --disabled: #979eaa; --line: #dfe2e9;
  --primary: #6951bd; --primary-soft: rgba(105, 81, 189, 0.11);
  --success: #23845a; --danger: #c83f50; --danger-soft: rgba(200, 63, 80, 0.1);
  --warning: #a96712; --blue: #276fc5; --shadow: 0 18px 60px rgba(45, 48, 58, 0.16);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 5px; font-size: 26px; }
h2 { margin-bottom: 10px; font-size: 17px; }
h3 { margin-bottom: 4px; font-size: 14px; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
pre { margin: 10px 0; padding: 12px; overflow-x: auto; border-radius: 7px; background: var(--paper-3); font-size: 11.5px; line-height: 1.5; }

/* Mockup 控制列 */
.prototype-bar { min-height: 54px; padding: 9px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #101219; border-bottom: 1px solid #2d3340; color: #f1f2f6; position: sticky; top: 0; z-index: 50; }
.prototype-bar > div:first-child { display: flex; gap: 10px; align-items: baseline; }
.prototype-bar span { color: #9aa2b1; font-size: 12px; }
.prototype-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.prototype-chip, .prototype-controls select { border: 1px solid #3c4351; border-radius: 8px; padding: 6px 9px; background: #1a1e27; color: #dfe2e9; font-size: 12px; }
.prototype-chip.active { color: #d9d0ff; border-color: #7561c6; background: rgba(170, 145, 255, 0.16); }
.prototype-separator { width: 1px; height: 22px; background: #3c4351; margin: 0 3px; }

/* App 外框 */
.stage { padding: 24px; min-height: calc(100vh - 54px); display: grid; place-items: start center; }
.app-shell { position: relative; width: min(1280px, 100%); height: min(900px, calc(100vh - 102px)); min-height: 680px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.site-header { height: 62px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { color: var(--text); text-decoration: none; font: 900 20px Georgia, serif; }
.brand small { color: var(--primary); font: 700 10px sans-serif; vertical-align: top; }
.site-header nav { display: flex; align-items: center; gap: 22px; color: var(--muted); font-size: 13px; }
.avatar { width: 30px; height: 30px; display: grid; place-items: center; color: #fff; background: #6e59bd; border-radius: 50%; font-weight: 800; }
.workspace-chrome { height: 45px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.breadcrumb strong { color: var(--primary); }
.muted, .page-head p { color: var(--muted); }
.mobile-nav { display: none; border: 0; background: transparent; font-size: 18px; }

/* 工作台側欄與內容區 */
.workspace-body { height: calc(100% - 107px); display: grid; grid-template-columns: 230px minmax(0, 1fr); }
.sidebar { padding: 10px 8px; overflow: auto; background: var(--paper); border-right: 1px solid var(--line); color: var(--muted); }
.side-label { margin: 16px 8px 5px; color: var(--disabled); font-size: 11px; font-weight: 800; letter-spacing: .45px; }
.side-label:first-child { margin-top: 6px; }
.sidebar button { width: 100%; min-height: 34px; padding: 7px 9px; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 5px; background: transparent; text-align: left; font-size: 13px; font-weight: 700; }
.sidebar button:hover { background: var(--paper-2); }
.sidebar button.active { padding-left: 6px; color: var(--text); background: var(--primary-soft); border-left: 3px solid var(--primary); }
.content { min-width: 0; padding: 26px 28px 44px; overflow: auto; display: grid; gap: 14px; align-content: start; max-width: 1000px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
.page-head p { margin-bottom: 0; font-size: 13px; }
.eyebrow { margin: 0 0 4px !important; color: var(--primary) !important; font-size: 10px; font-weight: 900; letter-spacing: 1.2px; }
.mode-switch { display: flex; padding: 3px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 9px; }
.mode-switch button { padding: 6px 11px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 11px; font-weight: 800; }
.mode-switch button.active { color: var(--text); background: var(--paper-3); }

/* 共用元件 */
.card { padding: 16px 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.notice { padding: 11px 13px; display: flex; align-items: center; gap: 10px; border: 1px solid color-mix(in srgb, var(--blue) 42%, var(--line)); border-radius: 8px; background: color-mix(in srgb, var(--blue) 8%, var(--paper)); color: var(--blue); }
.notice.warn { border-color: color-mix(in srgb, var(--warning) 45%, var(--line)); background: color-mix(in srgb, var(--warning) 8%, var(--paper)); color: var(--warning); align-items: flex-start; }
.notice p { flex: 1; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.notice p strong, .notice p b { color: var(--text); }
.outline, .notice button { padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--paper); font-size: 12px; font-weight: 700; white-space: nowrap; }
.danger-outline { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.primary { min-height: 36px; padding: 6px 16px; color: #fff; background: #715bc4; border: 0; border-radius: 7px; font-weight: 800; }
.danger-btn { min-height: 36px; padding: 6px 16px; color: #fff; background: #c83f50; border: 0; border-radius: 7px; font-weight: 800; }
.danger-text { color: var(--danger) !important; }
.helper { margin: 8px 0 0; color: var(--disabled); font-size: 11px; }
.tag { display: inline-block; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; font-weight: 600; vertical-align: middle; }
.link { border: 0; background: transparent; color: var(--primary); font-size: 12px; font-weight: 700; }
.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(5, 6, 10, .6); }
.dialog { width: min(440px, 100%); padding: 22px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.dialog .muted { font-size: 13px; line-height: 1.6; }
.dialog .notice { margin: 10px 0; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.snack { position: fixed; right: 24px; bottom: 24px; z-index: 80; min-width: 260px; padding: 12px; display: none; grid-template-columns: 22px 1fr 22px; gap: 9px; align-items: center; color: #fff; background: #23845a; border-radius: 8px; box-shadow: var(--shadow); }
.snack.show { display: grid; }
.snack.error { background: #9f3040; }
.snack strong { font-size: 13px; }
.snack button { border: 0; color: #fff; background: transparent; font-size: 18px; }


/* 頂欄鈴鐺與未讀 badge */
.bell { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 17px; }
.bell:hover, .bell.open { background: var(--paper-3); color: var(--text); }
.bell .count { position: absolute; top: 1px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; border: 2px solid var(--paper); border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 900; }

/* 鈴鐺 popover（桌機） */
.popover { position: absolute; top: 56px; right: 66px; z-index: 40; width: 400px; max-height: 560px; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.popover-head, .popover-foot { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.popover-head { border-bottom: 1px solid var(--line); }
.popover-head h2 { margin: 0; font-size: 15px; }
.popover-list { overflow: auto; }
.popover-foot { justify-content: center; border-top: 1px solid var(--line); }

/* 通知列：popover 與通知頁共用，compact 版只少了動作按鈕 */
.n-row { position: relative; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 11px; align-items: start; border-top: 1px solid var(--line); cursor: pointer; }
.n-row:first-child { border-top: 0; }
.n-row:hover { background: var(--paper-2); }
.n-row.unread { background: color-mix(in srgb, var(--primary) 6%, var(--paper)); }
.n-row.unread::before { content: ""; position: absolute; left: 4px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--primary); }
.n-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--paper-3); color: var(--muted); font-size: 15px; font-weight: 900; }
.n-icon.story { color: var(--primary); background: var(--primary-soft); }
.n-icon.project { color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
.n-icon.security { color: var(--warning); background: color-mix(in srgb, var(--warning) 15%, transparent); }
.n-body { min-width: 0; }
.n-title { margin: 0 0 3px; font-size: 13.5px; line-height: 1.5; }
.n-title b { font-weight: 800; }
.n-sub { margin: 0 0 4px; color: var(--muted); font-size: 12px; line-height: 1.5; }
.n-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--disabled); font-size: 11px; }
.tag.locked { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.tag.expiring { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, var(--line)); }
.tag.r18 { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.n-actions { display: flex; gap: 2px; }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--disabled); font-size: 14px; }
.icon-btn:hover { background: var(--paper-3); color: var(--text); }
.icon-btn.on { color: var(--primary); }
.icon-btn.del:hover { color: var(--danger); }
.compact .n-row { padding: 10px 14px; }
.compact .n-actions, .compact .tag.expiring { display: none; }

/* 通知頁：日期分組、篩選、保留期說明 */
.n-card { padding: 0; overflow: hidden; }
.n-group { padding: 9px 14px 7px; background: var(--paper-2); border-top: 1px solid var(--line); color: var(--disabled); font-size: 11px; font-weight: 800; letter-spacing: .4px; }
.n-group:first-child { border-top: 0; }
.filters { display: flex; gap: 6px; }
.filters button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); font-size: 12px; font-weight: 700; }
.filters button.active { color: var(--text); background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); }
.filters em { margin-left: 4px; color: var(--disabled); font-style: normal; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lock-meter { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 12px; color: var(--text); font-weight: 700; }
.lock-meter i { width: 70px; height: 5px; border-radius: 999px; background: var(--paper-3); overflow: hidden; }
.lock-meter i span { display: block; height: 100%; background: var(--primary); }
.lock-meter.full i span { background: var(--danger); }
.empty { padding: 44px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.empty b { display: block; margin-bottom: 4px; color: var(--text); font-size: 15px; }

body[data-view="mobile"] .app-shell { width: 390px; height: calc(100vh - 102px); min-height: 760px; }
body[data-view="mobile"] .workspace-body { grid-template-columns: minmax(0, 1fr); }
body[data-view="mobile"] .sidebar { display: none; }
body[data-view="mobile"] .mobile-nav { display: inline-block; }

body[data-view="mobile"] .content { padding: 18px 12px 36px; }
body[data-view="mobile"] .page-head { flex-direction: column; gap: 12px; }
body[data-view="mobile"] .notice { flex-direction: column; align-items: flex-start; }
body[data-view="mobile"] .n-row { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 9px; padding: 12px 6px 12px 14px; }
body[data-view="mobile"] .snack { left: 12px; right: 12px; bottom: 12px; min-width: 0; }

@media (max-width: 820px) {
  .prototype-bar { flex-direction: column; align-items: flex-start; }
  .stage { padding: 0; }
  .app-shell { width: 100%; border: 0; border-radius: 0; height: auto; min-height: calc(100vh - 100px); }
  .workspace-body { grid-template-columns: minmax(0, 1fr); height: auto; }
  .sidebar { display: none; }
  .mobile-nav { display: inline-block; }
  .site-header nav > span:not(.avatar) { display: none; }
  .content { padding: 18px 12px 36px; }
  .page-head { flex-direction: column; gap: 12px; }
  .n-row { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 9px; padding: 12px 6px 12px 14px; }
  .popover { left: 8px; right: 8px; width: auto; }
  .snack { left: 12px; right: 12px; bottom: 12px; min-width: 0; }
}

/* 左右分欄：列表＋內容 */
.content.wide { max-width: none; container-type: inline-size; }
.split { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 14px; align-items: start; }
.split-list { display: grid; gap: 10px; }
.n-row.selected { box-shadow: inset 3px 0 0 var(--primary); background: var(--paper-3); }
.detail { position: sticky; top: 0; min-height: 420px; padding: 0; overflow: hidden; }
.detail-empty { height: 420px; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; }
.detail-head { padding: 18px 20px 14px; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: start; border-bottom: 1px solid var(--line); }
.detail-head .n-icon { width: 40px; height: 40px; }
.detail-head h2 { margin: 0 0 5px; font-size: 17px; line-height: 1.45; }
.detail-body { padding: 18px 20px; display: grid; gap: 16px; font-size: 13.5px; line-height: 1.7; }
.detail-body h3 { margin: 0; color: var(--muted); font-size: 11px; letter-spacing: .4px; }
.detail-foot { padding: 12px 20px; border-top: 1px solid var(--line); color: var(--disabled); font-size: 11.5px; }
.back { display: none; margin: 12px 0 0 16px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ep-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.ep-list li { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
.ep-list li:first-child { border-top: 0; }
.ep-list small { color: var(--disabled); }
.cover { height: 130px; border-radius: 9px; background: linear-gradient(135deg, #3b2f6b, #1f4a5a 60%, #2a2233); display: flex; align-items: flex-end; padding: 12px 14px; color: #fff; font: 900 20px Georgia, serif; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.kv { margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-all; }
.letter { padding: 16px 18px; border-radius: 9px; background: var(--paper-2); border: 1px solid var(--line); white-space: pre-line; }
.tag.future { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, var(--line)); }
.n-icon.letter { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }

/* 手機：選了通知就只顯示內容頁 */
body[data-view="mobile"] .split { grid-template-columns: minmax(0, 1fr); }
body[data-view="mobile"] .detail { position: static; }
body[data-view="mobile"] .content.has-detail [data-mobile-list] { display: none; }
body[data-view="mobile"] .content:not(.has-detail) .detail { display: none; }
body[data-view="mobile"] .back { display: inline-block; }
body[data-view="mobile"] .detail-head { grid-template-columns: 34px minmax(0, 1fr); padding: 14px 14px 12px; }
body[data-view="mobile"] .detail-head .n-actions { grid-column: 1 / -1; justify-self: end; }
body[data-view="mobile"] .detail-body { padding: 14px; }
@media (max-width: 820px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
  .content.has-detail [data-mobile-list] { display: none; }
  .content:not(.has-detail) .detail { display: none; }
  .back { display: inline-block; }
}
.clamp { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

/* 內容區不夠放兩欄（平板／縮小視窗）時，跟手機一樣改成列表 → 內容切換 */
@container (max-width: 760px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static; }
  .has-detail [data-mobile-list] { display: none; }
  .content:not(.has-detail) .detail { display: none; }
  .back { display: inline-block; }
}

      .person .spacer { flex: 1; }
      .btn-follow { min-height: 34px; padding: 6px 14px; color: #fff; background: #715bc4; border: 0; border-radius: 999px; font-weight: 800; font-size: 13px; white-space: nowrap; }
      .btn-mutual { min-height: 34px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; cursor: default; }
      .split-btn { display: inline-flex; }
      .split-btn .btn-follow { border-radius: 999px 0 0 999px; }
      .split-btn select { border: 0; border-left: 1px solid rgba(255,255,255,.25); border-radius: 0 999px 999px 0; background: #715bc4; color: #fff; font-weight: 700; font-size: 12px; padding: 0 8px; }
      .identity-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
      .identity-note b { color: var(--text); }

      .work { display: flex; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; }
      .work .cover { width: 72px; height: 96px; font-size: 12px; }

      /* 作者頁 */
      .author-hero { display: flex; gap: 18px; align-items: center; padding: 20px; }
      .author-hero .face { width: 72px; height: 72px; font-size: 26px; }
      .author-hero .spacer { flex: 1; }
      .btn-outline-pill { min-height: 34px; padding: 6px 14px; border: 1px solid color-mix(in srgb, var(--primary) 55%, var(--line)); border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 13px; }
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 20px; }
      .tabs span { padding: 10px 12px; font-size: 13px; color: var(--muted); font-weight: 700; }
      .tabs span.active { color: var(--text); border-bottom: 2px solid var(--primary); }
      .tabs .owner-only { color: var(--warning); }
      .author-list { display: grid; gap: 10px; padding: 16px 20px; }
      .author-item { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 9px; }
      .author-item .spacer { flex: 1; }
      .state-switch { margin-bottom: 4px; }
      .callout { font-size: 12px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; line-height: 1.6; }
      .callout b { color: var(--text); }
    </style>
  </head>
  <body>
    <header class="prototype-bar">
      <div>
        <strong>被追蹤通知 Mockup</strong>
        <span>純靜態資料 · 通知頁／作者頁追蹤按鈕／筆名追蹤分頁／我的追蹤</span>
      </div>
      <div class="prototype-controls">
        <button class="prototype-chip active" data-screen="notify">通知頁</button>
        <button class="prototype-chip" data-screen="author">他人作者頁</button>
        <button class="prototype-chip" data-screen="pen">我的筆名頁</button>
        <button class="prototype-chip" data-screen="mine">我的追蹤</button>
        <span class="prototype-separator"></span>
        <button class="prototype-chip active" data-view="desktop">Desktop</button>
        <button class="prototype-chip" data-view="mobile">Mobile 390</button>
        <select id="themeSelect" aria-label="色彩模式">
          <option value="dark">深色</option>
          <option value="light">淺色</option>
        </select>
      </div>
    </header>

    <main class="stage">
      <div class="app-shell">
        <header class="site-header">
          <a class="brand" href="#">Steamloom <small>beta</small></a>
          <nav><span>探索</span><span>搜尋</span><button class="bell">🔔<span class="count">4</span></button><span class="avatar">F</span></nav>
        </header>
        <div class="workspace-chrome">
          <div class="breadcrumb" id="crumb"></div>
        </div>
        <div class="workspace-body">
          <aside class="sidebar">
            <p class="side-label">我的工作台</p>
            <button><span>▤</span>創作專案</button>
            <button class="active"><span>🔔</span>通知</button>
            <p class="side-label">我的追蹤</p>
            <button><span>♥</span>我的追蹤</button>
          </aside>
          <section class="content" id="content"></section>
        </div>
      </div>
    </main>
    <div class="snack" id="snack"><span>✓</span><strong id="snackText"></strong><button onclick="snack.classList.remove('show')">×</button></div>

    <script>
      // ---- 假資料：我（Faryne）有本人身份＋筆名「霧島」「夜行」 ----
      const colors = { 白夜: "#c0567a", 青嵐: "#3f8f7a", 小麥: "#b07a2a", 墨蝶: "#5965c0", 已刪除: "#555" };
      const face = (name, cls = "") => `<span class="face ${cls}" style="background:${colors[name] || "#6e59bd"}">${name[0]}</span>`;

      // follow_back：none 可回追／following 已互相追蹤／unavailable 身份已不存在
      const notifications = [
        { id: "n1", kind: "follow", actor: "白夜", target: "霧島", unread: true, time: "3 分鐘前", follow_back: "none",
          stats: "3 部作品 · 41 人追蹤" },
        { id: "n2", kind: "fav", actor: "青嵐", project: "霧都旅館", targets: ["霧島"], unread: true, time: "1 小時前", follow_back: "none",
          stats: "沒有公開作品 · 2 人追蹤" },
        { id: "n3", kind: "fav", actor: "小麥", project: "星屑列車", targets: ["Faryne", "夜行"], unread: true, time: "昨天", follow_back: "none",
          stats: "1 部作品 · 8 人追蹤" },
        { id: "n4", kind: "follow", actor: "墨蝶", target: null, unread: true, time: "昨天", follow_back: "following",
          stats: "12 部作品 · 530 人追蹤" },
        { id: "n5", kind: "story", text: "<b>鴉羽</b> 的《白鷺館》更新了 3 話", sub: "從 第二卷・雨夜 開始", time: "2 天前" },
        { id: "n6", kind: "follow", actor: "已刪除", target: "夜行", unread: false, time: "5 天前", follow_back: "unavailable",
          stats: "" },
      ];
      let selected = "n1";
      let authorState = "pen"; // none / self / pen
      let mobileDetail = false;

      // 列表標題：追蹤＝人為主詞；收藏＝作品為焦點
      const headline = (n) => {
        if (n.kind === "follow") {
          const who = n.follow_back === "unavailable" ? "<b>已不存在的使用者</b>" : `<b>${n.actor}</b>`;
          return n.target ? `${who} 追蹤了你的筆名 <b>${n.target}</b>` : `${who} 追蹤了你`;
        }
        if (n.kind === "fav") return `<b>${n.actor}</b> 收藏了你的作品《${n.project}》`;
        return n.text;
      };
      const leading = (n) => {
        if (n.kind === "follow") return face(n.actor);
        if (n.kind === "fav") return `<span class="cover">${n.project.slice(0, 2)}${face(n.actor, "mini")}</span>`;
        return `<span class="n-icon story">✦</span>`;
      };
      const kindTag = (n) => n.kind === "follow" ? `<span class="tag chip-follow">追蹤</span>`
        : n.kind === "fav" ? `<span class="tag chip-fav">收藏作品</span>` : `<span class="tag">新話公開</span>`;
      const mutualTag = (n) => n.follow_back === "following" ? `<span class="tag">已互相追蹤</span>` : "";

      const row = (n) => `
        <div class="n-row ${n.unread ? "unread" : ""} ${n.id === selected ? "selected" : ""}" data-select="${n.id}">
          ${leading(n)}
          <div class="n-body">
            <p class="n-title">${headline(n)}</p>
            ${n.sub ? `<p class="n-sub">${n.sub}</p>` : ""}
            <div class="n-meta">${n.time} ${kindTag(n)} ${mutualTag(n)}</div>
          </div>
          <div class="n-actions"><button class="icon-btn">🔓</button><button class="icon-btn del">🗑</button></div>
        </div>`;

      // 回追按鈕：依 follow_back 狀態與可用身份決定長相
      const followBackControl = (n) => {
        if (n.follow_back === "following") return `<button class="btn-mutual" disabled>✓ 已互相追蹤</button>`;
        if (n.follow_back === "unavailable") return "";
        const ids = n.kind === "follow" ? [n.target || "Faryne"] : n.targets;
        if (ids.length === 1) {
          const label = ids[0] === "Faryne" ? "回追" : `以 ${ids[0]} 回追`;
          return `<button class="btn-follow" data-follow="${n.id}" data-as="${ids[0]}">${label}</button>`;
        }
        // 多署名身份：下拉只列這部作品署名過的身份
        return `<span class="split-btn"><button class="btn-follow" data-follow="${n.id}" data-as-select>回追</button>
          <select id="asSelect" aria-label="以哪個身份回追">${ids.map((i) => `<option>以 ${i}</option>`).join("")}</select></span>`;
      };

      const identityNote = (n) => {
        if (n.follow_back === "unavailable") return `<p class="identity-note">這個身份已經不存在，無法回追。</p>`;
        if (n.kind === "follow") return n.target
          ? `<p class="identity-note">對方追蹤的是你的筆名 <b>${n.target}</b>，回追也會用 <b>${n.target}</b> 的身份，對方看不到這個筆名屬於誰。</p>`
          : `<p class="identity-note">對方追蹤的是你的本人身份，回追會用本人身份。</p>`;
        return n.targets.length > 1
          ? `<p class="identity-note">這部作品有 ${n.targets.length} 個署名身份，選一個回追。只列出這部作品署名過的身份。</p>`
          : `<p class="identity-note">這部作品署名 <b>${n.targets[0]}</b>，回追會用 <b>${n.targets[0]}</b> 的身份。</p>`;
      };

      const person = (n) => n.follow_back === "unavailable"
        ? `<div class="person">${face("已刪除")}<div><h3>已不存在的使用者</h3><p class="stats">對方已刪除這個身份</p></div></div>`
        : `<div class="person">
            <span title="前往 ${n.actor} 的創作者頁" data-goto-author>${face(n.actor)}</span>
            <div><h3><a href="#" data-goto-author>${n.actor}</a></h3><p class="stats">${n.stats}</p></div>
            <span class="spacer"></span>${followBackControl(n)}
          </div>`;

      const detail = (n) => {
        if (n.kind === "story") return `<div class="detail-body"><p class="muted">（新話通知沿用既有內容頁，這份 mockup 不重畫）</p></div>`;
        const work = n.kind === "fav" ? `
          <div class="work"><span class="cover">${n.project.slice(0, 2)}</span>
            <div><h3>《${n.project}》</h3><p class="muted small">署名：${n.targets.join("、")} · 24 話 · 收藏 87</p>
            <button class="outline">前往作品首頁</button></div></div>` : "";
        return `
          <button class="link back" data-back>‹ 返回通知</button>
          <div class="detail-head">${leading(n)}<div><h2 style="margin:0 0 4px">${headline(n)}</h2>
            <div class="n-meta">${n.time} ${kindTag(n)}</div></div></div>
          <div class="detail-body">${n.kind === "fav" ? work : ""}${person(n)}${identityNote(n)}</div>
          <div class="detail-foot">這則通知會在 172 天後自動清除，想留下來可以按右上角的鎖頭。</div>`;
      };

      const screens = {
        notify: {
          crumb: ["Steamloom", "我的工作台", "通知"],
          render: () => {
            const n = notifications.find((x) => x.id === selected);
            return `<div class="page-head"><div><p class="eyebrow">NOTIFICATIONS</p><h1>通知</h1></div></div>
              <div class="split"><div class="list-pane n-card">${notifications.map(row).join("")}</div>
              <div class="detail-pane">${detail(n)}</div></div>`;
          },
        },
        author: {
          crumb: ["Steamloom", "創作者", "白夜"],
          render: () => {
            // 三種狀態：沒追蹤／本人已追蹤／只以筆名追蹤
            const btn = authorState === "none" ? `<button class="btn-follow">追蹤作者</button>`
              : authorState === "self" ? `<button class="btn-outline-pill">✓ 已追蹤作者</button>`
              : `<button class="btn-outline-pill" title="點擊取消以 霧島 的追蹤">✓ 已以 霧島 追蹤</button>`;
            return `<div class="mode-switch state-switch" style="width:max-content">
                ${[["none", "未追蹤"], ["self", "本人已追蹤"], ["pen", "只以筆名追蹤"]].map(([k, l]) =>
                  `<button class="${authorState === k ? "active" : ""}" data-author-state="${k}">${l}</button>`).join("")}
              </div>
              <div class="card" style="padding:0">
                <div class="author-hero">${face("白夜")}<div><h1 style="margin:0">白夜</h1><p class="muted small">3 部作品 · 41 人追蹤</p></div>
                  <span class="spacer"></span>${btn}</div>
                <div class="tabs"><span class="active">作品</span><span>追蹤的作品</span><span>追蹤的作家</span></div>
                <div class="author-list"><p class="muted small">（作品列表略）</p></div>
              </div>
              <div class="callout">「只以筆名追蹤」時：按鈕顯示 <b>已以 霧島 追蹤</b>，點下去跳 confirm「要取消以 霧島 的追蹤嗎？」，
                取消的是 霧島 那一筆；不會新增本人追蹤。本人跟筆名都追蹤時，按鈕照舊顯示「已追蹤作者」，只管本人那一筆。</div>`;
          },
        },
        pen: {
          crumb: ["Steamloom", "創作者", "霧島"],
          render: () => `
            <div class="card" style="padding:0">
              <div class="author-hero">${face("霧島")}<div><h1 style="margin:0">霧島</h1><p class="muted small">2 部作品 · 17 人追蹤</p></div>
                <span class="spacer"></span><button class="outline">編輯筆名</button></div>
              <div class="tabs"><span>作品</span><span class="active owner-only">此筆名追蹤的作家 🔒</span></div>
              <div class="author-list">
                <p class="helper" style="margin:0">只有你看得到這個分頁。以筆名做的追蹤不會出現在本人作者頁，也不會出現在這個筆名的公開頁。</p>
                <div class="author-item">${face("白夜")}<div><h3>白夜</h3><p class="muted small">3 部作品 · 41 人追蹤</p></div><span class="spacer"></span><button class="outline">取消追蹤</button></div>
                <div class="author-item">${face("青嵐")}<div><h3>青嵐</h3><p class="muted small">沒有公開作品 · 2 人追蹤</p></div><span class="spacer"></span><button class="outline">取消追蹤</button></div>
              </div>
            </div>
            <div class="callout">其他人看「霧島」的作者頁：只有「作品」分頁（維持現況）。</div>`,
        },
        mine: {
          crumb: ["Steamloom", "我的工作台", "我的追蹤"],
          render: () => `
            <div class="page-head"><div><p class="eyebrow">FOLLOWING</p><h1>追蹤的作家</h1><p>本人與筆名的追蹤都列在這裡，筆名追蹤會標註用哪個身份。</p></div></div>
            <div class="card author-list" style="padding:12px">
              <div class="author-item">${face("墨蝶")}<div><h3>墨蝶</h3><p class="muted small">12 部作品 · 530 人追蹤</p></div><span class="spacer"></span><button class="outline">取消追蹤</button></div>
              <div class="author-item">${face("白夜")}<div><h3>白夜 <span class="tag chip-follow">以 霧島 追蹤</span></h3><p class="muted small">3 部作品 · 41 人追蹤</p></div><span class="spacer"></span><button class="outline">取消追蹤</button></div>
              <div class="author-item">${face("青嵐")}<div><h3>青嵐 <span class="tag chip-follow">以 霧島 追蹤</span></h3><p class="muted small">沒有公開作品 · 2 人追蹤</p></div><span class="spacer"></span><button class="outline">取消追蹤</button></div>
            </div>`,
        },
      };
      let screen = "notify";

      const render = () => {
        document.getElementById("crumb").innerHTML = screens[screen].crumb
          .map((c, i, a) => (i === a.length - 1 ? `<strong>${c}</strong>` : `<span class="muted">${c}</span><b>›</b>`)).join("");
        document.getElementById("content").innerHTML = screens[screen].render();
        document.body.classList.toggle("show-detail", mobileDetail);
      };
      const toast = (text, error) => {
        snackText.textContent = text;
        snack.classList.toggle("error", !!error);
        snack.classList.add("show");
        setTimeout(() => snack.classList.remove("show"), 2400);
      };

      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-screen],[data-view],[data-select],[data-follow],[data-back],[data-author-state],[data-goto-author]");
        if (!t) return;
        if (t.dataset.screen) {
          screen = t.dataset.screen;
          document.querySelectorAll("[data-screen]").forEach((b) => b.classList.toggle("active", b === t));
        } else if (t.dataset.view) {
          document.body.classList.toggle("mobile", t.dataset.view === "mobile");
          document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("active", b === t));
        } else if (t.dataset.select) {
          selected = t.dataset.select;
          notifications.find((x) => x.id === selected).unread = false;
          mobileDetail = true;
        } else if (t.dataset.back !== undefined) {
          mobileDetail = false;
        } else if (t.dataset.follow) {
          const n = notifications.find((x) => x.id === t.dataset.follow);
          const as = t.dataset.as || document.getElementById("asSelect").value.replace("以 ", "");
          n.follow_back = "following";
          toast(as === "Faryne" ? `已回追 ${n.actor}` : `已以 ${as} 回追 ${n.actor}`);
        } else if (t.dataset.authorState) {
          authorState = t.dataset.authorState;
        } else if (t.dataset.gotoAuthor !== undefined) {
          e.preventDefault();
          screen = "author";
          document.querySelectorAll("[data-screen]").forEach((b) => b.classList.toggle("active", b.dataset.screen === "author"));
        }
        render();
      });
      themeSelect.onchange = () => (document.documentElement.dataset.theme = themeSelect.value);
      render();
    </script>
  </body>
</html>
