<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SteamLoom Writer — 儲存位置設定</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans TC", system-ui, sans-serif; background: #0d1018; color: #edf0f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 960px; min-height: 680px; background: #0d1018; }
    header { height: 48px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid #303745; background: #151923; }
    .brand { font-family: Georgia, serif; font-size: 17px; font-weight: 700; }
    .brand span { margin-left: 8px; padding: 2px 7px; border: 1px solid #4f6180; border-radius: 999px; color: #a9c7ff; font: 11px Inter, sans-serif; }
    .crumbs { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid #303745; color: #9da7b8; font-size: 13px; }
    .crumbs b { color: #8bb8ff; font-weight: 600; }
    main { height: calc(100vh - 92px); display: flex; }
    nav { width: 220px; padding: 10px 8px; border-right: 1px solid #303745; background: #151923; }
    .nav-item { width: 100%; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-radius: 5px; background: transparent; color: #bac3d2; text-align: left; }
    .nav-item.selected { background: #26344d; color: #dce9ff; }
    .icon { width: 18px; color: #8bb8ff; text-align: center; }
    section { flex: 1; overflow: auto; padding: 30px 38px 110px; }
    .panel { max-width: 780px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .lead { margin: 0 0 34px; color: #9da7b8; font-size: 14px; }
    .group-title { margin: 30px 0 14px; font-size: 15px; font-weight: 700; }
    .group-title:first-of-type { margin-top: 0; }
    .setting-row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 26px; align-items: start; padding: 20px; border: 1px solid #3a4352; border-radius: 8px; background: #171c27; }
    .setting-label { font-size: 14px; font-weight: 650; }
    .setting-description { margin-top: 5px; color: #929cad; font-size: 12px; line-height: 1.55; }
    select, input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #4b586d; border-radius: 5px; background: #0f131c; color: #edf0f7; font-size: 14px; outline: none; }
    select:focus, input:focus { border-color: #79aaff; box-shadow: 0 0 0 2px #4b7ed944; }
    .path-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .button { height: 42px; padding: 0 15px; border: 1px solid #53627a; border-radius: 5px; background: #202938; color: #e8edf7; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .button:hover { background: #2a3548; }
    .path-actions { display: flex; justify-content: flex-end; margin-top: 7px; }
    .text-button { border: 0; background: transparent; color: #8bb8ff; cursor: pointer; }
    .page-actions { position: fixed; right: 28px; bottom: 24px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid #3a4352; border-radius: 8px; background: #171c27e8; box-shadow: 0 8px 28px #05070bb8; backdrop-filter: blur(8px); }
    .saved { min-width: 190px; color: #83d19a; font-size: 12px; text-align: right; opacity: 0; transition: opacity .15s; }
    .saved.show { opacity: 1; }
    .save { min-width: 108px; height: 36px; padding: 0 16px; border: 1px solid #6499ec; border-radius: 5px; background: #3972c8; color: white; font-weight: 650; cursor: pointer; }
    .save:disabled { border-color: #424b5a; background: #2c323d; color: #707989; cursor: default; }
  </style>
</head>
<body>
  <header><div class="brand">SteamLoom <span>Writer</span></div></header>
  <div class="crumbs"><span>我的專案</span><span>›</span><span>應用程式設定</span><span>›</span><b>一般設定</b></div>
  <main>
    <nav>
      <button class="nav-item selected"><span class="icon">⚙</span><span>一般設定</span></button>
      <button class="nav-item"><span class="icon">▧</span><span>媒體 Worker</span></button>
    </nav>
    <section>
      <div class="panel">
        <h1>一般設定</h1>
        <p class="lead">管理 SteamLoom Writer 在這台裝置上的介面與本機資料。</p>

        <div class="group-title">介面</div>
        <div class="setting-row">
          <div>
            <div class="setting-label">介面語言</div>
            <div class="setting-description">選擇語言後儲存，Writer 會立即套用。</div>
          </div>
          <select id="language" aria-label="介面語言">
            <option value="zh-TW">正體中文（台灣）</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>

        <div class="group-title">儲存位置</div>
        <div class="setting-row">
          <div>
            <div class="setting-label">本機資料目錄</div>
            <div class="setting-description">對話記錄、Worker 設定與 Agent 工作資料會存放在這個資料夾；變更位置時會複製現有資料，重新啟動 Writer 後套用。</div>
          </div>
          <div>
            <div class="path-row">
              <input id="storage-path" value="~/Library/Application Support/SteamLoom Writer" readonly aria-label="本機資料目錄" />
              <button class="button" id="browse" type="button">選擇資料夾</button>
            </div>
            <div class="path-actions"><button class="text-button" id="reset" type="button">恢復預設位置</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="page-actions">
    <div class="saved" id="saved">設定已儲存；重新啟動後套用新的儲存位置。</div>
    <button class="save" id="save" type="button" disabled>儲存設定</button>
  </div>
  <script>
    const defaultPath = "~/Library/Application Support/SteamLoom Writer";
    const customPath = "~/Documents/SteamLoom Writer Data";
    const path = document.querySelector("#storage-path");
    const language = document.querySelector("#language");
    const save = document.querySelector("#save");
    const saved = document.querySelector("#saved");
    let savedLanguage = language.value;
    let savedPath = path.value;
    const refresh = () => {
      save.disabled = language.value === savedLanguage && path.value === savedPath;
      saved.classList.remove("show");
    };
    language.addEventListener("change", refresh);
    document.querySelector("#browse").addEventListener("click", () => { path.value = customPath; refresh(); });
    document.querySelector("#reset").addEventListener("click", () => { path.value = defaultPath; refresh(); });
    save.addEventListener("click", () => {
      savedLanguage = language.value;
      savedPath = path.value;
      refresh();
      requestAnimationFrame(() => saved.classList.add("show"));
    });
  </script>
</body>
</html>
