<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>galgame.tv 版面改善 Mockup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Mockup 控制列：切換畫面／裝置寬度／色彩模式／改動說明，不屬於產品 UI -->
    <header class="prototype-bar">
      <div>
        <strong>galgame.tv 版面改善 Mockup</strong>
        <span>純靜態資料（取自本機 API）</span>
      </div>
      <div class="prototype-controls">
        <button class="prototype-chip active" data-screen="home">首頁</button>
        <button class="prototype-chip" data-screen="search">搜尋結果</button>
        <button class="prototype-chip" data-screen="brand">品牌頁</button>
        <button class="prototype-chip" data-screen="video">影片頁</button>
        <span class="prototype-separator"></span>
        <button class="prototype-chip active" data-view="desktop">Desktop</button>
        <button class="prototype-chip" data-view="mobile">Mobile 390</button>
        <span class="prototype-separator"></span>
        <button class="prototype-chip active" data-theme-option="light">淺色</button>
        <button class="prototype-chip" data-theme-option="dark">深色</button>
        <span class="prototype-separator"></span>
        <label class="prototype-toggle"><input type="checkbox" id="notesToggle" checked /> 改動說明</label>
      </div>
    </header>

    <aside class="prototype-notes" id="notes"></aside>

    <main class="stage">
      <div class="device" id="device">
        <div class="site" id="site"></div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
