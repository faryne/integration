<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV 女優主題頁 mockup</title>
<style>
  :root { --bg:#f3f4f6; --paper:#fff; --line:#e5e7eb; --muted:#6b7280; --text:#111827; --primary:#2e7d6b; --primary-soft:#e6f2ef;
          --warn:#fef3c7; --warnb:#f59e0b; --warnt:#92400e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#d1d5db; color:var(--text); }
  .toolbar { position:sticky; top:0; z-index:20; background:#111827; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--primary); }
  .toolbar .sep { width:1px; height:20px; background:#4b5563; margin:0 4px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .frame { margin:0 auto; background:var(--bg); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); width:1100px; flex:0 0 auto; position:relative; min-height:640px; }
  .frame.mobile { width:375px; }
  .nav { background:#161b22; color:#fff; height:44px; display:flex; align-items:center; padding:0 16px; font-weight:700; font-size:14px; gap:16px; }
  .nav small { font-weight:400; color:#9ca3af; }
  .crumb { background:var(--paper); border-bottom:1px solid var(--line); padding:8px 16px; font-size:12px; color:var(--muted); }
  .crumb a { color:var(--primary); cursor:pointer; text-decoration:none; }
  .url { font-family:ui-monospace,monospace; font-size:12px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-bottom:12px; color:#374151; word-break:break-all; }
  .page { padding:20px 16px 32px; }
  h2 { margin:0; font-size:22px; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .pagehead .meta { color:var(--muted); font-size:13px; margin-top:4px; }
  .paper { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .groups { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .mobile .groups { grid-template-columns:1fr; }
  .group.wide { grid-column:1 / -1; }
  .group h3 { margin:0 0 10px; font-size:15px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13px; border:1px solid #cbd5e1; border-radius:16px; padding:4px 10px; background:#fff; cursor:pointer; color:var(--text); white-space:nowrap; }
  .chip:hover { border-color:var(--primary); }
  .chip small { color:var(--muted); margin-left:4px; }
  .chip.on { background:var(--primary); border-color:var(--primary); color:#fff; cursor:default; }
  .chip.on small { color:#d1fae5; }
  .toggle { display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; background:#fff; }
  .toggle a { padding:7px 12px; font-size:13px; cursor:pointer; border-left:1px solid #cbd5e1; white-space:nowrap; }
  .toggle a:first-child { border-left:0; }
  .toggle a.on { background:var(--primary-soft); color:var(--primary); font-weight:700; }
  .siblings { margin-bottom:16px; }
  .siblings .chips { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
  .results { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .mobile .results { grid-template-columns:repeat(2,1fr); }
  .acard { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; cursor:pointer; position:relative; }
  .acard:hover { box-shadow:0 4px 12px rgba(0,0,0,.08); }
  .photo { aspect-ratio:3/4; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); display:flex; align-items:flex-end; justify-content:center; font-size:11px; color:#475569; padding:6px; }
  .acard .body { padding:6px 8px 8px; }
  .acard b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acard .stat { color:var(--muted); margin-top:2px; line-height:1.5; }
  .acard .stat em { font-style:normal; color:var(--primary); font-weight:700; }
  .rank { position:absolute; top:6px; left:6px; background:rgba(17,24,39,.75); color:#fff; font-size:11px; font-weight:700; border-radius:4px; padding:1px 6px; }
  .pager { display:flex; gap:4px; justify-content:center; margin-top:20px; }
  .pager a { min-width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:16px; font-size:13px; cursor:pointer; }
  .pager a.on { background:var(--primary); color:#fff; }
  .detail { display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; }
  .mobile .detail { grid-template-columns:1fr; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; text-align:left; margin-top:10px; }
  .facts dt { color:var(--muted); } .facts dd { margin:0; }
  .facts a { color:var(--primary); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .vgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .mobile .vgrid { grid-template-columns:repeat(2,1fr); }
  .cover { aspect-ratio:16/10; border-radius:8px; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); }
  .btn { border:0; border-radius:6px; padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; background:var(--primary); color:#fff; white-space:nowrap; }
  .btn.outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .searchlayout { display:grid; grid-template-columns:1fr 2fr; gap:16px; align-items:start; }
  .mobile .searchlayout { grid-template-columns:1fr; }
  .field { height:36px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; margin-bottom:10px; }
  .hl { outline:3px solid #f59e0b; outline-offset:2px; border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:700; background:#f9fafb; white-space:nowrap; }
  tr.row { cursor:pointer; } tr.row:hover { background:#f9fafb; }
  .mobile .hide-m { display:none; }
  .badge { font-size:11px; border-radius:4px; padding:2px 6px; font-weight:700; background:var(--warn); color:var(--warnt); white-space:nowrap; }
  .sw { display:inline-block; width:34px; height:20px; border-radius:10px; background:#cbd5e1; position:relative; cursor:pointer; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; }
  .sw.on { background:var(--primary); } .sw.on::after { left:16px; }
  .editlayout { display:grid; grid-template-columns:1fr 2fr; gap:16px; align-items:start; }
  .mobile .editlayout { grid-template-columns:1fr; }
  .section { font-size:13px; font-weight:700; color:var(--muted); margin:0 0 10px; }
  .fgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:12px; }
  .fgrid.one, .mobile .fgrid { grid-template-columns:1fr; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0; }
  label.f input, label.f select, .genrerow input, .ac { border:1px solid #cbd5e1; border-radius:6px; padding:8px 10px; font-size:14px; color:var(--text); background:#fff; font-family:inherit; min-width:0; }
  .range { display:flex; gap:6px; align-items:center; } .range input, .range select { flex:1; width:0; }
  .cond { display:grid; grid-template-columns:72px 1fr; gap:8px; align-items:start; margin-bottom:12px; font-size:13px; }
  .cond > span { color:var(--muted); font-size:12px; padding-top:6px; }
  .mobile .cond { grid-template-columns:1fr; }
  .ac { padding:4px 10px; font-size:13px; }
  .genrerow { display:flex; gap:6px; align-items:center; margin-bottom:8px; font-size:13px; }
  .genrerow input:first-child { flex:1; }
  .iconbtn { width:32px; height:34px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; color:var(--muted); }
  .textbtn { border:1px dashed #94a3b8; background:#fff; border-radius:6px; padding:6px 12px; font-size:13px; color:var(--primary); cursor:pointer; font-weight:700; }
  .btns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #cbd5e1; }
  .btn.danger { background:#b91c1c; }
  .note { font-size:12px; color:#1e3a8a; background:#eff6ff; border:1px dashed #93c5fd; border-radius:8px; padding:8px 10px; margin-top:16px; line-height:1.7; }
</style>

    return `<b>女優主題頁 mockup</b><span class="sep"></span>` +
      SCREENS.map(([k, s]) => `<button class="${state.screen === k ? "on" : ""}" onclick="go('${k}')">${s}</button>`).join("") +
      `<span class="sep"></span><button class="${state.mobile ? "" : "on"}" onclick="set('mobile',false)">桌機</button><button class="${state.mobile ? "on" : ""}" onclick="set('mobile',true)">手機</button>`;
  }

  // ===== 主題總覽：依類別分區，每個主題一個 chip，附人數 =====
  function index() {
    const groups = GROUPS.map((g) => `<div class="paper group ${g.wide ? "wide" : ""}"><h3>${g.label}</h3><div class="chips">${
      g.topics.map((x) => `<a class="chip" onclick="open('${x.slug}')">${x.label}<small>${fmt(x.count)}</small></a>`).join("")}</div></div>`).join("");
    return shell(crumbTopics(""), "/av/actress/topics", `
      <div class="pagehead"><div><h2>女優主題</h2><div class="meta">更新於 2026/11/05</div></div><button class="btn outline hl" onclick="go('manage')">管理主題</button></div>
      <div class="groups">${groups}</div>`);
  }

  // ===== 主題頁：標題、同類別切換、排序、卡片格線、分頁 =====
  function topicPage(kind) {
    const { group, topic } = find(state.slug) ?? find("horoscope-aries");
    if (topic.genre) kind = "genre";
    const sorts = kind === "genre" ? [["genre",`${topic.genre ?? topic.label}出演數`],["videos","總出演數"],["recent","最近出演"],["name","名字"]]
      : kind === "newcomer" ? [["debut","出道日"],["videos","出演數"],["name","名字"]]
      : topic.slug === "active" ? [["recent","最近出演"],["videos","出演數"],["name","名字"]]
      : [["videos","出演數"],["recent","最近出演"],["name","名字"]];
    const sort = state.sort || sorts[0][0];
    const range = group.key === "horoscope" ? D.horoscope.find(([s]) => `horoscope-${s}` === topic.slug)[2] : "";
    const perPage = state.mobile ? 24 : 48, pages = Math.ceil(topic.count / perPage);
    const qs = [sort !== sorts[0][0] && `sort=${sort}`, state.page > 1 && `page=${state.page}`].filter(Boolean).join("&");
    const url = `/av/actress/topics/${topic.slug}${qs ? "?" + qs : ""}`;
    // 同類別的其他主題：橫向捲動的 chip 列，目前這個高亮
    const siblings = `<div class="siblings"><div class="chips">${group.topics.map((x) =>
      `<a class="chip ${x.slug === topic.slug ? "on" : ""}" ${x.slug === topic.slug ? "" : `onclick="open('${x.slug}')"`}>${x.label}<small>${fmt(x.count)}</small></a>`).join("")}</div></div>`;
    const toggle = `<div class="toggle">${sorts.map(([k, l]) => `<a class="${k === sort ? "on" : ""}" onclick="Object.assign(state,{sort:'${k}',page:1});render()">${l}</a>`).join("")}</div>`;
    const cards = cardsFor(kind, topic, sort).map((c, i) => `<div class="acard" onclick="go('detail')">
        ${sort === sorts[0][0] && kind !== "newcomer" && sort !== "name" ? `<span class="rank">${(state.page - 1) * perPage + i + 1}</span>` : ""}
        <div class="photo">照片</div><div class="body"><b>${c.name}</b><div class="stat">${c.stat}</div></div></div>`).join("");
    const pager = `<div class="pager">${[1, 2, 3].filter((p) => p <= pages).map((p) =>
      `<a class="${p === state.page ? "on" : ""}" onclick="set('page',${p})">${p}</a>`).join("")}${pages > 4 ? `<a>…</a><a onclick="set('page',${pages})">${pages}</a>` : ""}</div>`;
    return shell(crumbTopics(topic.label), url, `
      <div class="pagehead"><div><h2>${topic.label}</h2><div class="meta">${group.label}${range ? `・${range}` : ""}${topic.summary ? `・${topic.summary}` : ""}・${fmt(topic.count)} 位</div></div>${toggle}</div>
      ${siblings}
      <div class="results">${cards}</div>${pager}
      ${kind === "genre" && !topic.genre ? `<div class="note">mockup 說明：排行只算「含這個標籤、且不是總集編」的影片，${fmt(5)} 部以上才列入；女優名字已去掉 DMM 名字裡的（別名）。</div>` : ""}
      ${kind === "attr" && group.key === "horoscope" ? `<div class="note">mockup 說明：xcity 有約 300 位女優的生日是 11/30（疑似預設值），星座主題排除 11/30，出生年代照算。</div>` : ""}`);
  }

  // 假資料卡片：名字取自 prod，數字依排序方式產生
  function cardsFor(kind, topic, sort) {
    const n = state.mobile ? 8 : 12;
    if (kind === "genre") {
      const g = topic.genre ?? topic.label;
      const src = D.genre_samples[topic.slug] ?? D.genre_samples[g] ?? D.genre_samples["熟女"];
      let list = src.slice(0, n).map(([name, g], i) => ({ name, g, all:Math.round(g * (1.6 + (i % 4) * .4)), last:`2026/${String(10 - (i % 9)).padStart(2, "0")}` }));
      if (sort === "videos") list.sort((a, b) => b.all - a.all);
      if (sort === "recent") list.sort((a, b) => b.last.localeCompare(a.last));
      if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "ja"));
      return list.map((x) => ({ name:x.name, stat:`<em>${g} ${fmt(x.g)} 部</em><br>共 ${fmt(x.all)} 部<br>最近 ${x.last}` }));
    }
    const base = D.aries_samples.slice(0, n).map((a, i) => ({ name:a.name, videos:[312, 268, 241, 198, 176, 150, 133, 120, 96, 81, 64, 52][i], last:`20${["26/10","25/12","26/09","19/04","26/10","24/07","26/08","15/02","26/10","22/11","26/06","18/03"][i]}`, debut:`2026/${String(10 - i % 10).padStart(2, "0")}` }));
    if (kind === "newcomer") {
      const list = base.map((x, i) => ({ ...x, videos:[18, 12, 9, 15, 7, 11, 6, 8, 5, 4, 3, 2][i] }));
      if (sort === "videos") list.sort((a, b) => b.videos - a.videos);
      if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "ja"));
      return list.map((x) => ({ name:x.name, stat:`<em>出道 ${x.debut}</em><br>出演 ${x.videos} 部` }));
    }
    const list = [...base];
    if (sort === "recent") list.sort((a, b) => b.last.localeCompare(a.last));
    if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "ja"));
    return list.map((x) => ({ name:x.name, stat:`出演 ${x.videos} 部<br>最近 ${x.last}` }));
  }

  // ===== 入口：女優頁資料卡的星座、血型、出身地等改成主題連結（黃框為新增） =====
  function detail() {
    const a = D.aries_samples[0];
    const link = (slug, label) => `<a class="hl" onclick="open('${slug}')">${label}</a>`;
    return shell(`首頁 / <a onclick="go('search')">AV 女優搜尋</a> / ${a.name}`, `/av/actress/${a.name}`, `
      <div class="detail">
        <div class="card" style="text-align:center">
          <div class="photo" style="max-width:200px;margin:0 auto 12px">照片</div>
          <b style="font-size:18px">${a.name}</b>
          <dl class="facts">
            <dt>生日</dt><dd>${a.birth_year}/${a.birth_month}/${a.birth_day}（${link("horoscope-aries", "牡羊座")}）</dd>
            <dt>出生年代</dt><dd>${link("born-1980s", "80 年代")}</dd>
            <dt>身高</dt><dd>${a.height} cm</dd>
            <dt>罩杯</dt><dd>${a.cup} cup</dd>
            <dt>血型</dt><dd>A 型</dd>
            <dt>出身地</dt><dd>${link("pref-kanagawa", "神奈川県")}</dd>
          </dl>
        </div>
        <div class="card"><b>出演影片</b><div class="vgrid" style="margin-top:12px">${"<div class='cover'></div>".repeat(6)}</div></div>
      </div>
      <div class="note">mockup 說明：只有星座、出生年代、出身地會變成連結，而且要 index.json 裡有這個主題（人數不足 30 的出身地維持純文字）。身材主題要看條件才知道符不符合，女優頁不顯示。</div>`);
  }

  // ===== 入口：女優搜尋頁標題列加「女優主題」按鈕（黃框為新增） =====
  function search() {
    return shell("首頁 / AV 女優搜尋", "/av/actress", `
      <div class="pagehead"><h2>AV 女優搜尋</h2><div style="display:flex;gap:8px"><button class="btn outline hl" onclick="go('index')">女優主題</button><button class="btn outline">新增女優</button></div></div>
      <div class="searchlayout">
        <div class="paper"><b>搜尋條件</b><div style="margin-top:12px">${"<div class='field'></div>".repeat(5)}</div></div>
        <div class="paper"><b>搜尋結果</b><div class="results" style="margin-top:12px;grid-template-columns:repeat(${state.mobile ? 2 : 4},1fr)">${"<div class='acard'><div class='photo'>照片</div><div class='body'><b>女優</b></div></div>".repeat(state.mobile ? 4 : 8)}</div></div>
      </div>`);
  }

  // ===== 管理：主題列表（只列自訂主題；內建主題不能編輯） =====
  function manage() {
    const rows = [...GROUPS[0].topics.map((x) => ({ ...x, g:"特輯" })), ...GROUPS[1].topics.map((x) => ({ ...x, g:"身材" })),
      { label:"高挑痴女", slug:"tall-chijo", summary:"身高 168cm 以上・痴女 5 部以上", g:"特輯", count:null },
      { label:"昭和熟女", slug:"showa-jukujo", summary:"1989 年以前出生・熟女 5 部以上", g:"特輯", count:122, off:true }];
    const row = (x) => `<tr class="row" onclick="go('edit')" style="${x.off ? "color:var(--muted)" : ""}">
      <td style="white-space:nowrap"><span style="color:var(--muted);cursor:grab">⋮⋮</span></td>
      <td><b>${x.label}</b><div style="color:var(--muted);font-size:12px">${x.slug}</div></td>
      <td style="white-space:nowrap">${x.g}</td><td class="hide-m">${x.summary}</td>
      <td style="white-space:nowrap">${x.count == null ? `<span class="badge">尚未產生</span>` : `${fmt(x.count)} 位<div style="color:var(--muted);font-size:12px">2026/11/05</div>`}</td>
      <td><span class="sw ${x.off ? "" : "on"}" onclick="event.stopPropagation()"></span></td></tr>`;
    return shell(`首頁 / <a onclick="go('search')">AV 女優搜尋</a> / <a onclick="go('index')">女優主題</a> / 管理主題`, "/av/actress/topics/manage", `
      <div class="pagehead"><h2>管理主題</h2><button class="btn" onclick="go('edit')">新增主題</button></div>
      <div class="paper" style="padding:0;overflow-x:auto"><table>
        <thead><tr><th></th><th>主題</th><th>分組</th><th class="hide-m">條件</th><th>上次產生</th><th>啟用</th></tr></thead>
        <tbody>${rows.map(row).join("")}</tbody></table></div>
      <div class="note">mockup 說明：拖曳 ⋮⋮ 調整總覽頁順序。新增或修改後要等下一次每週排程（週四 04:30）才會產生，之前顯示「尚未產生」或上次的結果。</div>`);
  }

  // ===== 管理：編輯主題（以「東京痴女」為例） =====
  function edit() {
    const HORO = D.horoscope.map(([, l]) => l), BLOOD = ["A","B","O","AB"];
    const chips = (list, on) => `<div class="chips">${list.map((x) => `<span class="chip ${on.includes(x) ? "on" : ""}">${x}</span>`).join("")}</div>`;
    const range = (label, unit = "") => `<label class="f"><span>${label}</span><div class="range"><input placeholder="最小"><span>～</span><input placeholder="最大">${unit ? `<span>${unit}</span>` : ""}</div></label>`;
    return shell(`首頁 / <a onclick="go('search')">AV 女優搜尋</a> / <a onclick="go('index')">女優主題</a> / <a onclick="go('manage')">管理主題</a> / 東京痴女`, "/av/actress/topics/manage/12", `
      <div class="pagehead"><h2>編輯主題</h2></div>
      <div class="editlayout">
        <div class="paper"><div class="section">基本資料</div>
          <div class="fgrid one">
            <label class="f"><span>標題</span><input value="東京痴女"></label>
            <label class="f"><span>slug</span><input value="tokyo-chijo"></label>
            <label class="f"><span>分組</span><select><option selected>特輯</option><option>身材</option></select></label>
            <label class="f"><span>預設排序</span><select><option>出演數</option><option>最近出演</option><option selected>類型出演數</option><option>出道日</option></select></label>
          </div>
        </div>
        <div class="paper"><div class="section">條件</div>
          <div class="cond"><span>星座</span>${chips(HORO, [])}</div>
          <div class="cond"><span>血型</span>${chips(BLOOD, [])}</div>
          <div class="fgrid">
            ${range("出生年")}${range("身高", "cm")}
            <label class="f"><span>罩杯</span><div class="range"><select><option>不限</option></select><span>～</span><select><option>不限</option></select></div></label>
            ${range("臀腰差")}${range("胸圍")}${range("腰圍")}${range("臀圍")}
          </div>
          <div class="cond"><span>出身地</span><div class="chips"><span class="chip on">東京都 ✕</span><input class="ac" placeholder="輸入都道府県"></div></div>
          <div class="cond"><span>類型</span><div>
            <div class="genrerow"><input value="痴女"><span>至少</span><input value="5" style="width:56px"><span>部</span><button class="iconbtn">✕</button></div>
            <button class="textbtn">＋ 類型條件</button></div></div>
          <div class="fgrid">
            <label class="f"><span>出道在幾個月內</span><input placeholder="不限"></label>
            <label class="f"><span>最後出演在幾個月內</span><input placeholder="不限"></label>
            <label class="f"><span>總出演數至少</span><input placeholder="不限"></label>
          </div>
        </div>
      </div>
      <div class="btns"><button class="btn danger" onclick="alert('mockup：會先跳 confirm「確定要刪除「東京痴女」？」')">刪除</button><span style="flex:1"></span><button class="btn ghost" onclick="go('manage')">取消</button><button class="btn" onclick="go('manage')">儲存</button></div>
      <div class="note">mockup 說明：同一個欄位內多選是 OR，不同欄位之間是 AND；空白代表不限。不做即時預覽人數，儲存後等下一次排程產生。</div>`);
  }

  function render() {
    document.getElementById("toolbar").innerHTML = toolbar();
    const f = document.getElementById("frame");
    f.className = "frame" + (state.mobile ? " mobile" : "");
    f.innerHTML = { index, manage, edit, body:() => topicPage("attr"), special:() => topicPage("attr"), attr:() => topicPage("attr"), genre:() => topicPage("genre"), newcomer:() => topicPage("newcomer"), detail, search }[state.screen]();
  }
  render();
</script>
</body>
</html>
