<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV 女優上稿審核 mockup</title>
<style>
  :root { --bg:#f3f4f6; --paper:#fff; --line:#e5e7eb; --muted:#6b7280; --text:#111827; --primary:#2e7d6b; --primary-soft:#e6f2ef;
          --add:#e7f6ec; --addt:#166534; --del:#fdecec; --delt:#991b1b; --warn:#fef3c7; --warnb:#f59e0b; --warnt:#92400e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#d1d5db; color:var(--text); }
  .toolbar { position:sticky; top:0; z-index:20; background:#111827; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--primary); }
  .toolbar .sep { width:1px; height:20px; background:#4b5563; margin:0 4px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .stage > .frame { margin:0 auto; }
  .frame { background:var(--bg); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); width:1100px; flex:0 0 auto; position:relative; min-height:640px; }
  .frame.mobile { width:375px; }
  .nav { background:#161b22; color:#fff; height:44px; display:flex; align-items:center; padding:0 16px; font-weight:700; font-size:14px; gap:16px; position:relative; }
  .nav small { font-weight:400; color:#9ca3af; }
  .avatar { margin-left:auto; width:28px; height:28px; border-radius:50%; background:#4b5563; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; position:relative; }
  .avatar .dot { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:#f59e0b; border:2px solid #161b22; }
  .login { margin-left:auto; font-size:12px; font-weight:400; color:#d1d5db; }
  .menu { position:absolute; right:12px; top:42px; background:#fff; color:var(--text); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,.2); width:220px; z-index:9; font-weight:400; font-size:14px; overflow:hidden; }
  .menu div { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; }
  .menu div:hover { background:#f9fafb; }
  .menu .count { background:var(--warn); color:var(--warnt); border-radius:10px; padding:0 7px; font-size:12px; font-weight:700; }
  .crumb { background:var(--paper); border-bottom:1px solid var(--line); padding:8px 16px; font-size:12px; color:var(--muted); }
  .page { padding:20px 16px 32px; }
  h2 { margin:0 0 4px; font-size:22px; } .sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .paper { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mobile .grid2, .mobile .grid4 { grid-template-columns:1fr 1fr; }
  .formlayout { display:grid; grid-template-columns:200px 1fr; gap:20px; }
  .mobile .formlayout { grid-template-columns:1fr; }
  .mobile .formlayout .photo { max-width:140px; margin:0 auto; }
  .photo { aspect-ratio:3/4; border-radius:8px; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); display:flex; align-items:flex-end; justify-content:center; font-size:12px; color:#475569; padding:8px; }
  .section { font-size:13px; font-weight:700; color:var(--muted); margin:16px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0; }
  label.f input, label.f textarea, label.f select { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:9px 10px; font-size:14px; color:var(--text); background:#fff; font-family:inherit; }
  label.f.changed input { border-color:var(--primary); background:var(--primary-soft); }
  label.f.changed > span:first-child::after { content:"・已修改"; color:var(--primary); font-weight:700; }
  label.f.error input { border-color:#dc2626; }
  label.f .was { font-size:11px; color:var(--muted); }
  label.f .err { font-size:11px; color:#dc2626; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; border:1px solid #cbd5e1; border-radius:6px; padding:3px 8px; background:#fff; }
  .chip.on { background:var(--primary); border-color:var(--primary); color:#fff; }
  .chip.add { background:var(--add); border-color:#86efac; color:var(--addt); }
  .chip.del { background:var(--del); border-color:#fca5a5; color:var(--delt); text-decoration:line-through; }
  .linkrow { display:grid; grid-template-columns:180px 1fr 32px; gap:8px; align-items:center; margin-bottom:8px; }
  .mobile .linkrow { grid-template-columns:1fr 32px; }
  .mobile .linkrow label:first-child { grid-column:1 / -1; }
  .linkrow.added input { border-color:var(--primary); background:var(--primary-soft); }
  .linkrow.removed input { text-decoration:line-through; color:var(--delt); background:var(--del); border-color:#fca5a5; }
  .iconbtn { width:32px; height:36px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; color:var(--muted); }
  .textbtn { border:1px dashed #94a3b8; background:#fff; border-radius:6px; padding:7px 12px; font-size:13px; color:var(--primary); cursor:pointer; font-weight:700; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .btn { border:0; border-radius:6px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; background:var(--primary); color:#fff; white-space:nowrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #cbd5e1; }
  .btn.outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.danger { background:#b91c1c; }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .alert { font-size:13px; border-radius:8px; padding:10px 12px; margin-bottom:12px; line-height:1.6; }
  .alert.warn { background:var(--warn); border:1px solid var(--warnb); color:var(--warnt); }
  .alert.info { background:#eff6ff; border:1px solid #93c5fd; color:#1e3a8a; }
  .alert a { color:inherit; font-weight:700; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:12px; gap:4px; }
  .tabs a { padding:10px 14px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs a.on { color:var(--primary); border-color:var(--primary); font-weight:700; }
  .badge { display:inline-block; white-space:nowrap; font-size:11px; border-radius:4px; padding:1px 6px; font-weight:700; }
  .badge.create { background:#dbeafe; color:#1d4ed8; } .badge.edit { background:#ede9fe; color:#6d28d9; }
  .badge.pending { background:var(--warn); color:var(--warnt); } .badge.approved { background:var(--add); color:var(--addt); } .badge.rejected { background:var(--del); color:var(--delt); }
  .badge.mcp { background:#e5e7eb; color:#374151; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:700; background:#f9fafb; }
  tr.row { cursor:pointer; } tr.row:hover { background:#f9fafb; }
  td.old { background:var(--del); color:var(--delt); } td.new { background:var(--add); color:var(--addt); font-weight:700; }
  td.same { color:var(--muted); } td.now { background:var(--warn); color:var(--warnt); }
  .linklist { display:flex; flex-direction:column; gap:4px; }
  .linklist span { font-size:12px; padding:2px 6px; border-radius:4px; word-break:break-all; }
  .linklist .add { background:var(--add); color:var(--addt); } .linklist .del { background:var(--del); color:var(--delt); text-decoration:line-through; }
  .diffhead { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .toggle { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; margin:0; }
  .meta dt { color:var(--muted); } .meta dd { margin:0; word-break:break-all; }
  .reviewlayout { display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
  .mobile .reviewlayout { grid-template-columns:1fr; }
  .mobile .hide-m { display:none; }
  .dup { display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:8px; font-size:13px; }
  .dup .thumb { width:40px; height:52px; border-radius:4px; background:#cbd5e1; flex:0 0 auto; }
  .mask { position:absolute; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .dialog { background:#fff; border-radius:12px; padding:20px; width:520px; max-width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25); max-height:90%; overflow:auto; }
  .dialog h3 { margin:0 0 8px; font-size:18px; }
  .dialog p { font-size:14px; color:#374151; line-height:1.6; margin:0 0 12px; }
  .opt { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; cursor:pointer; font-size:14px; }
  .opt.on { border-color:var(--primary); background:var(--primary-soft); }
  .opt.disabled { opacity:.5; cursor:not-allowed; }
  .opt small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .done { text-align:center; padding:40px 16px; } .done .icon { font-size:44px; }
  .detail { display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; }
  .mobile .detail { grid-template-columns:1fr; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h4 { margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .reflinks a { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; color:#1d4ed8; text-decoration:none; border-bottom:1px solid var(--line); word-break:break-all; }
  .reflinks a:last-child { border-bottom:0; }
  .reflinks a small { color:var(--muted); margin-left:auto; font-size:11px; white-space:nowrap; }
  .results { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mobile .results { grid-template-columns:repeat(2,1fr); }
  .acard { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; }
  .acard .photo { border-radius:0; } .acard p { margin:6px 8px 8px; }
  .hl { outline:3px solid #f59e0b; outline-offset:2px; border-radius:6px; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
  // ===== 假資料 =====
  const LINKS_NOW = [
    { title:"FANZA 女優ページ", url:"https://actress.dmm.co.jp/-/detail/=/actress_id=1060000/" },
  ];
  const CURRENT = { name:"あおいれな", kana:"あおいれな", photo:"https://img.xcity.jp/actress/xxxx.jpg", height:158, bust:80, waist:58, hips:85, cup:"A",
    blood:"", born_city:"", birth_year:1996, birth_month:3, birth_day:19, interests:["カラオケ"], links:LINKS_NOW };
  const PROPOSED = { ...CURRENT, height:157, cup:"B", blood:"O", born_city:"東京都", interests:["カラオケ","ゲーム"],
    links:[...LINKS_NOW, { title:"X（Twitter）", url:"https://x.com/aoi_rena_xxx" }, { title:"", url:"https://www.instagram.com/aoirena_xxx/" }] };
  const NOW = { ...CURRENT, height:159 };
  // 新增單：與 xcity 上「姓名完全相同」的女優重複，xcity 那筆缺生日與三圍
  const DUP_EXISTING = { name:"水城ひなの", kana:"みずきひなの", photo:"https://img.xcity.jp/actress/yyyy.jpg", height:0, bust:0, waist:0, hips:0, cup:"",
    blood:"", born_city:"", birth_year:0, birth_month:0, birth_day:0, interests:[], links:[] };
  const NEW_ONE = { name:"水城ひなの", kana:"みずきひなの", photo:"https://pics.dmm.co.jp/mono/actjpgs/yyyy.jpg", height:152, bust:83, waist:56, hips:82, cup:"K",
    blood:"A", born_city:"千葉県", birth_year:2004, birth_month:7, birth_day:2, interests:["お菓子作り"],
    links:[{ title:"所屬事務所", url:"https://example-agency.jp/talent/hinano" }, { title:"X（Twitter）", url:"https://x.com/hinano_xxx" }] };
  const FIELDS = [
    ["name","姓名"],["kana","假名"],["photo","照片網址"],["height","身高"],["bust","胸圍（B）"],["waist","腰圍（W）"],["hips","臀圍（H）"],
    ["cup","罩杯"],["blood","血型"],["born_city","出生地"],["birthday","生日"],["interests","興趣"],["links","參考連結"],
  ];
  const SUBMISSIONS = [
    { id:1043, kind:"edit", name:"あおいれな", changed:6, channel:"web", who:"匿名（IP 1a2b…）", at:"10/30 14:12", status:"pending", conflict:true },
    { id:1042, kind:"create", name:"水城ひなの", changed:13, channel:"mcp", who:"MCP（IP 9f3c…）", at:"10/30 11:40", status:"pending", dup:true },
    { id:1039, kind:"edit", name:"春咲あずみ", changed:1, channel:"web", who:"匿名（IP 4c5e…）", at:"10/29 22:05", status:"pending" },
    { id:1031, kind:"create", name:"七瀬いおり", changed:11, channel:"web", who:"匿名（IP 77d0…）", at:"10/28 09:30", status:"approved", reviewer:"faryne" },
    { id:1028, kind:"create", name:"美谷朱里", changed:9, channel:"web", who:"匿名（IP 2e8a…）", at:"10/27 20:11", status:"approved", reviewer:"faryne", merged:"合併到既有女優" },
    { id:1027, kind:"edit", name:"美谷朱里", changed:2, channel:"mcp", who:"MCP（IP 9f3c…）", at:"10/27 18:02", status:"rejected", reviewer:"faryne", reason:"資料來源不可信" },
  ];
  const PENDING = SUBMISSIONS.filter((s) => s.status === "pending").length;

  const state = { screen:"search", mobile:false, admin:true, menu:false, adminTab:"pending", onlyChanged:true, dialog:null, rejectReason:"", dupChoice:"merge" };
  const SCREENS = [
    ["search","入口：女優搜尋"],["detail","入口：女優頁"],["create","新增女優"],["edit","修改資料"],["done","送出完成"],
    ["list","管理列表"],["review-edit","審核：修改單"],["review-create","審核：新增單（重複）"],
  ];

  const isLinks = (k) => k === "links";
  const linkText = (l) => l.title ? `${l.title}｜${l.url}` : l.url;
  const fmt = (o, k) => {
    if (k === "birthday") return o.birth_year ? `${o.birth_year}/${o.birth_month}/${o.birth_day}` : "";
    const v = o[k];
    if (isLinks(k)) return (v ?? []).map(linkText).join("\n");
    if (Array.isArray(v)) return v.join("、");
    if (["height","bust","waist","hips"].includes(k)) return v ? `${v}cm` : "";
    return v ?? "";
  };
  const same = (a, b, k) => fmt(a, k) === fmt(b, k);
  const empty = (s) => s === "" ? `<span style="color:#9ca3af">（未填）</span>` : s;
  const host = (url) => new URL(url).hostname.replace(/^www\./, "");

  function go(screen) { Object.assign(state, { screen, dialog:null, menu:false }); render(); }
  function set(k, v) { state[k] = v; render(); }

  function toolbar() {
    return `<b>女優上稿審核 mockup</b><span class="sep"></span>` +
      SCREENS.map(([k, t]) => `<button class="${state.screen === k ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("") +
      `<span class="sep"></span><button class="${state.admin ? "on" : ""}" onclick="set('admin',${!state.admin})">${state.admin ? "以管理者（id=1）檢視" : "以訪客檢視"}</button>` +
      `<button class="${state.mobile ? "" : "on"}" onclick="set('mobile',false)">桌機</button><button class="${state.mobile ? "on" : ""}" onclick="set('mobile',true)">手機</button>`;
  }

  // 管理入口：只有 users.id = 1 才看得到頭像選單裡的「女優上稿審核」
  function nav() {
    const right = state.admin
      ? `<div class="avatar" onclick="set('menu',${!state.menu})">F${PENDING ? '<span class="dot"></span>' : ""}</div>`
      : `<span class="login">登入</span>`;
    const menu = state.admin && state.menu
      ? `<div class="menu"><div onclick="go('list')">AV 女優上稿審核 <span class="count">${PENDING}</span></div><div>登出</div></div>` : "";
    return `<div class="nav">Faryne 的實驗室 <small>大人的喜好</small>${right}${menu}</div>`;
  }
  const shell = (crumb, body) => `${nav()}<div class="crumb">${crumb}</div><div class="page">${body}</div>`;
  const guard = (body) => state.admin ? body
    : `<div class="paper done"><div class="icon">🔒</div><h2>需要管理者權限</h2><div class="btns" style="justify-content:center"><button class="btn">登入</button></div></div>`;

  // ===== 入口：女優搜尋頁 =====
  function search() {
    const cards = ["あおいれな","今井麻衣","いろはめる","春咲あずみ"].map((n) =>
      `<div class="acard"><div class="photo" style="aspect-ratio:3/4"></div><p><b>${n}</b></p></div>`).join("");
    return shell("首頁 / 大人的喜好 / AV 女優搜尋",
      `<div class="pagehead"><div><h2>AV 女優搜尋</h2><p class="sub" style="margin:0">依姓名、罩杯、出生年份與身形條件篩選女優資料。</p></div>
         <button class="btn outline hl" onclick="go('create')">＋ 新增女優</button></div>
       <div class="paper"><b>搜尋結果</b><p class="sub">共 26 筆資料</p><div class="results">${cards}</div></div>`);
  }

  // ===== 入口：女優詳細頁（含連結區塊）=====
  function detail() {
    const links = CURRENT.links.map((l) => `<a href="#">🔗 ${l.title || host(l.url)}<small>${host(l.url)}</small></a>`).join("");
    return shell("首頁 / 大人的喜好 / AV 女優搜尋 / あおいれな",
      `<div class="detail">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="card" style="text-align:center">
            <div class="photo" style="width:160px;margin:0 auto 10px"></div>
            <b style="font-size:18px">あおいれな</b><div class="sub" style="margin:0">あおいれな</div>
            <div style="text-align:left;font-size:14px;line-height:1.9;margin-top:8px">三圍：80A / 58 / 85<br>生日：1996/3/19<br>身高：158 cm</div>
            <div class="btns" style="justify-content:center"><button class="btn outline sm hl" onclick="go('edit')">修改資料</button></div>
          </div>
          <div class="card hl"><h4>連結</h4><div class="reflinks">${links}</div></div>
          <div class="card"><h4>發售商</h4><div class="chips"><span class="chip">MOODYZ</span><span class="chip">S1</span></div></div>
        </div>
        <div class="card"><h4>出演影片</h4><div class="results">${[1,2,3,4].map(() => '<div class="acard"><div class="photo" style="aspect-ratio:1429/1944"></div><p>ABC-123</p></div>').join("")}</div></div>
      </div>`);
  }

  // ===== 新增／修改共用表單 =====
  function linkEditor(isEdit, v) {
    const base = isEdit ? CURRENT.links.map((l) => l.url) : [];
    const rows = v.links.map((l) => {
      const added = isEdit && !base.includes(l.url);
      return `<div class="linkrow ${added ? "added" : ""}">
        <label class="f"><input value="${l.title}" placeholder="名稱（選填）"></label>
        <label class="f"><input value="${l.url}" placeholder="https://"></label>
        <button class="iconbtn" title="移除">✕</button></div>`;
    }).join("");
    return `${rows}<button class="textbtn">＋ 新增連結</button>`;
  }
  function form(isEdit) {
    const v = isEdit ? PROPOSED : { interests:[], links:[{ title:"", url:"" }] };
    const base = isEdit ? CURRENT : null;
    const f = (k, label, type = "text") => {
      const changed = isEdit && !same(base, v, k);
      return `<label class="f ${changed ? "changed" : ""}"><span>${label}</span><input type="${type}" value="${v[k] ?? ""}">${changed ? `<span class="was">原本：${empty(fmt(base, k))}</span>` : ""}</label>`;
    };
    const changedCount = isEdit ? FIELDS.filter(([k]) => !same(base, v, k)).length : 0;
    const interestChips = isEdit
      ? [...new Set([...base.interests, ...v.interests])].map((x) => `<span class="chip ${base.interests.includes(x) ? "" : "add"}">${x} ×</span>`).join("") : "";
    // 罩杯：文字框，送出前轉大寫並檢查格式（AAA、AA、A～Z）
    const cupField = isEdit ? f("cup","罩杯")
      : `<label class="f"><span>罩杯</span><input value="K" placeholder="例如 D、K"></label>`;
    return shell(
      isEdit ? "首頁 / 大人的喜好 / AV 女優搜尋 / あおいれな / 修改資料" : "首頁 / 大人的喜好 / AV 女優搜尋 / 新增女優",
      `<h2 style="margin-bottom:12px">${isEdit ? "修改女優資料：あおいれな" : "新增女優"}</h2>
       ${isEdit ? `<div class="alert info">已修改 <b>${changedCount}</b> 個欄位</div>`
                : `<div class="alert warn">已有同名女優：<a onclick="go('detail')">水城ひなの</a>。如果是同一位，請到該女優頁按「修改資料」。</div>`}
       <div class="paper formlayout">
         <div>
           <div class="photo">${isEdit ? "目前照片" : "照片預覽"}</div>
           <label class="f" style="margin-top:10px"><span>照片網址</span><input value="${v.photo ?? ""}" placeholder="https://"></label>
         </div>
         <div>
           <div class="section" style="margin-top:0">基本資料</div>
           <div class="grid2">${f("name","姓名 *")}${f("kana","假名")}</div>
           <div class="section">身形</div>
           <div class="grid4">${f("height","身高（cm）","number")}${f("bust","B（cm）","number")}${f("waist","W（cm）","number")}${f("hips","H（cm）","number")}</div>
           <div class="section">其他</div>
           <div class="grid4">
             <label class="f"><span>生日・年</span><input type="number" value="${v.birth_year ?? ""}"></label>
             <label class="f"><span>月</span><input type="number" value="${v.birth_month ?? ""}"></label>
             <label class="f"><span>日</span><input type="number" value="${v.birth_day ?? ""}"></label>
             ${cupField}
           </div>
           <div class="grid4" style="margin-top:12px">${f("blood","血型")}${f("born_city","出生地")}
             <label class="f ${isEdit ? "changed" : ""}" style="grid-column:span 2"><span>興趣（Enter 新增）</span><input placeholder="輸入後按 Enter">
               <div class="chips">${interestChips}</div></label>
           </div>
           <div class="section">參考連結${isEdit ? '<span style="color:var(--primary)">新增 2 筆</span>' : ""}</div>
           ${linkEditor(isEdit, v)}
           <div class="btns"><button class="btn ghost">取消</button><button class="btn" onclick="go('done')">送出審核</button></div>
         </div>
       </div>`);
  }

  const done = () => shell("首頁 / 大人的喜好 / AV 女優搜尋 / 新增女優",
    `<div class="paper done"><div class="icon">📨</div><h2>已送出審核</h2>
     <p class="sub">提交單編號 <b>#1044</b></p>
     <div class="btns" style="justify-content:center"><button class="btn ghost" onclick="go('create')">再新增一位</button><button class="btn" onclick="go('search')">回到女優搜尋</button></div></div>`);

  // ===== 管理列表 =====
  function list() {
    const rows = SUBMISSIONS.filter((s) => s.status === state.adminTab);
    const tab = (k, t) => `<a class="${state.adminTab === k ? "on" : ""}" onclick="set('adminTab','${k}')">${t}${k === "pending" ? `（${PENDING}）` : ""}</a>`;
    return shell("首頁 / 大人的喜好 / AV 女優上稿審核", guard(
      `<h2 style="margin-bottom:16px">AV 女優上稿審核</h2>
       <div class="paper">
         <div class="tabs">${tab("pending","待審核")}${tab("approved","已核准")}${tab("rejected","已否決")}</div>
         <table><thead><tr><th>#</th><th>類型</th><th>女優</th><th class="hide-m">變更欄位</th><th class="hide-m">提交者</th><th>時間</th>${state.adminTab === "pending" ? "" : '<th class="hide-m">審核</th>'}</tr></thead>
         <tbody>${rows.map((s) => `<tr class="row" onclick="go('${s.kind === "edit" ? "review-edit" : "review-create"}')">
           <td>${s.id}</td><td><span class="badge ${s.kind}">${s.kind === "edit" ? "修改" : "新增"}</span></td>
           <td>${s.name}${s.conflict ? ' <span class="badge pending">資料已變更</span>' : ""}${s.dup ? ' <span class="badge pending">同名女優</span>' : ""}</td>
           <td class="hide-m">${s.changed} 個</td>
           <td class="hide-m">${s.who}${s.channel === "mcp" ? ' <span class="badge mcp">MCP</span>' : ""}</td>
           <td>${s.at}</td>
           ${state.adminTab === "pending" ? "" : `<td class="hide-m">${s.reviewer}${s.reason || s.merged ? `<br><small style="color:var(--muted)">${s.reason || s.merged}</small>` : ""}</td>`}
         </tr>`).join("")}</tbody></table>
       </div>`));
  }

  // ===== diff 表格 =====
  function linkDiff(base, prop) {
    const b = base.map((l) => l.url), p = prop.map((l) => l.url);
    const all = [...base, ...prop.filter((l) => !b.includes(l.url))];
    return `<div class="linklist">${all.map((l) => `<span class="${!p.includes(l.url) ? "del" : !b.includes(l.url) ? "add" : ""}">${linkText(l)}</span>`).join("")}</div>`;
  }
  function diffTable(base, prop, now) {
    const conflictFields = now ? FIELDS.filter(([k]) => !same(base, now, k)) : [];
    const fields = FIELDS.filter(([k]) => !state.onlyChanged || !same(base, prop, k) || conflictFields.some(([c]) => c === k));
    const rows = fields.map(([k, label]) => {
      const changed = !same(base, prop, k);
      const conflict = conflictFields.some(([c]) => c === k);
      let newCell = empty(fmt(prop, k));
      if (k === "interests") newCell = `<div class="chips">${[...new Set([...base.interests, ...prop.interests])].map((x) =>
        `<span class="chip ${!prop.interests.includes(x) ? "del" : !base.interests.includes(x) ? "add" : ""}">${x}</span>`).join("")}</div>`;
      if (isLinks(k)) newCell = linkDiff(base.links, prop.links);
      const oldCell = isLinks(k) ? `<div class="linklist">${base.links.map((l) => `<span>${linkText(l)}</span>`).join("") || empty("")}</div>` : empty(fmt(base, k));
      return `<tr><th style="width:100px">${label}</th>
        <td class="${changed ? "old" : "same"}">${oldCell}</td>
        ${conflictFields.length ? `<td class="${conflict ? "now" : "same"}">${empty(fmt(now, k))}</td>` : ""}
        <td class="${changed ? "new" : "same"}">${changed ? newCell : "—"}</td></tr>`;
    }).join("");
    return `<div style="overflow-x:auto"><table><thead><tr><th>欄位</th><th>目前的值</th>${conflictFields.length ? "<th>現在的值</th>" : ""}<th>提交的新值</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ===== 審核詳情 =====
  function review(kind) {
    const isEdit = kind === "edit";
    const s = SUBMISSIONS.find((x) => x.kind === kind && x.status === "pending");
    // 新增單：與同名女優比對，讓管理者直接看到「合併的話會改什麼」
    const table = isEdit ? diffTable(CURRENT, PROPOSED, NOW) : diffTable(DUP_EXISTING, NEW_ONE);
    return shell("首頁 / 大人的喜好 / AV 女優上稿審核 / #" + s.id, guard(
      `<h2>#${s.id} <span class="badge ${kind}">${isEdit ? "修改" : "新增"}</span> ${s.name}</h2><p class="sub">${s.at} 由 ${s.who} 提交</p>
       <div class="reviewlayout">
         <div class="paper">
           ${isEdit ? `<div class="alert warn"><b>提交後資料已變更：</b>身高在 10/30 03:50 被 xcity 同步更新為 159cm。核准會以提交的新值 157cm 覆寫。</div>`
                    : `<div class="alert warn"><b>已有同名女優：</b>水城ひなの（xcity）。下表為與該女優比對的結果，核准時可選擇合併或否決。</div>`}
           <div class="diffhead"><b>${isEdit ? "變更內容" : "與同名女優比對"}</b>
             <label class="toggle"><input type="checkbox" ${state.onlyChanged ? "checked" : ""} onchange="set('onlyChanged',this.checked)">只顯示有差異的欄位</label></div>
           ${table}
         </div>
         <div style="display:flex;flex-direction:column;gap:12px">
           <div class="paper">
             <div class="photo" style="max-width:160px;margin:0 auto 12px">${isEdit ? "目前照片" : "提交的照片"}</div>
             <dl class="meta"><dt>管道</dt><dd>${s.channel === "mcp" ? "MCP" : "網頁"}</dd>
               <dt>寫入方式</dt><dd>${isEdit ? "xcity 女優 → 存成覆寫欄位，之後同步不會蓋掉" : "依核准時的選擇"}</dd></dl>
           </div>
           ${isEdit ? "" : `<div class="paper"><b style="font-size:13px">同名女優</b>
             <div class="dup"><div class="thumb"></div><div>水城ひなの<br><small style="color:var(--muted)">xcity・みずきひなの・生日未登錄</small></div></div></div>`}
           <div class="paper" style="display:flex;gap:8px">
             <button class="btn danger" style="flex:1" onclick="set('dialog','reject')">否決</button>
             <button class="btn" style="flex:1" onclick="set('dialog','${isEdit ? "approve" : "approve-dup"}')">核准</button>
           </div>
         </div>
       </div>`));
  }

  function dialog() {
    const actions = (label, cls = "") => `<div class="btns"><button class="btn ghost" onclick="set('dialog',null)">取消</button><button class="btn ${cls}" onclick="go('list')">${label}</button></div>`;
    if (state.dialog === "approve") {
      return `<div class="mask"><div class="dialog"><h3>核准這張提交單？</h3>
        <p>會更新「あおいれな」的 6 個欄位與參考連結，並立即反映到搜尋結果。</p>${actions("核准")}</div></div>`;
    }
    if (state.dialog === "approve-dup") {
      const opt = (k, title, desc, disabled) => `<div class="opt ${state.dupChoice === k ? "on" : ""} ${disabled ? "disabled" : ""}" ${disabled ? "" : `onclick="set('dupChoice','${k}')"`}>
        <input type="radio" ${state.dupChoice === k ? "checked" : ""} ${disabled ? "disabled" : ""}><div>${title}<small>${desc}</small></div></div>`;
      return `<div class="mask"><div class="dialog"><h3>核准：已有同名女優</h3>
        ${opt("merge","合併到既有的「水城ひなの」（xcity）","把提交內容寫進既有女優：有填的欄位覆寫、沒填的保留原值，參考連結合併。這張單會記錄為「合併」。")}
        ${opt("new","新增為另一位女優","女優頁網址以姓名區分，同名會無法分別開啟，因此姓名完全相同時不能選。", true)}
        ${actions("合併並核准")}</div></div>`;
    }
    if (state.dialog === "reject") {
      const reasons = ["資料來源不可信","與現有女優重複","資料有誤","沒有實質變更"];
      return `<div class="mask"><div class="dialog"><h3>否決這張提交單？</h3>
        <div class="chips" style="margin-bottom:8px">${reasons.map((r) => `<span class="chip ${state.rejectReason === r ? "on" : ""}" style="cursor:pointer" onclick="set('rejectReason','${r}')">${r}</span>`).join("")}</div>
        <label class="f"><span>否決原因（選填）</span><textarea rows="3">${state.rejectReason}</textarea></label>
        ${actions("否決", "danger")}</div></div>`;
    }
    return "";
  }

  function render() {
    document.getElementById("toolbar").innerHTML = toolbar();
    const frame = document.getElementById("frame");
    frame.className = "frame" + (state.mobile ? " mobile" : "");
    const views = { search, detail, create: () => form(false), edit: () => form(true), done, list,
      "review-edit": () => review("edit"), "review-create": () => review("create") };
    frame.innerHTML = views[state.screen]() + dialog();
  }
  render();
</script>
</body>
</html>
