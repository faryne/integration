<!doctype html>

<title>AV 影片修改審核 mockup</title>
<style>
  :root { --bg:#f3f4f6; --paper:#fff; --line:#e5e7eb; --muted:#6b7280; --text:#111827; --primary:#2e7d6b; --primary-soft:#e6f2ef;
          --add:#e7f6ec; --addt:#166534; --del:#fdecec; --delt:#991b1b; --warn:#fef3c7; --warnb:#f59e0b; --warnt:#92400e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#d1d5db; color:var(--text); }
  .toolbar { position:sticky; top:0; z-index:20; background:#111827; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--primary); }
  .toolbar .sep { width:1px; height:20px; background:#4b5563; margin:0 4px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .frame { margin:0 auto; background:var(--bg); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); width:1100px; flex:0 0 auto; position:relative; min-height:640px; }
  .frame.mobile { width:375px; }
  .nav { background:#161b22; color:#fff; height:44px; display:flex; align-items:center; padding:0 16px; font-weight:700; font-size:14px; gap:16px; }
  .nav small { font-weight:400; color:#9ca3af; }
  .crumb { background:var(--paper); border-bottom:1px solid var(--line); padding:8px 16px; font-size:12px; color:var(--muted); }
  .page { padding:20px 16px 32px; }
  h2 { margin:0 0 16px; font-size:22px; }
  .paper { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .grid { display:grid; gap:12px; }
  .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .mobile .g4 { grid-template-columns:1fr 1fr; } .mobile .g2.keep { grid-template-columns:1fr 1fr; } .mobile .g2:not(.keep) { grid-template-columns:1fr; }
  .formlayout { display:grid; grid-template-columns:200px minmax(0,1fr); gap:20px; }
  .mobile .formlayout { grid-template-columns:1fr; }
  .cover { aspect-ratio:1429/1944; border-radius:8px; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); display:flex; align-items:flex-end; justify-content:center; font-size:12px; color:#475569; padding:8px; }
  .mobile .formlayout .cover { max-width:140px; margin:0 auto; width:100%; }
  .section { font-size:13px; font-weight:700; color:var(--muted); margin:18px 0 8px; }
  .section:first-child { margin-top:0; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0; }
  label.f input, label.f textarea { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:9px 10px; font-size:14px; color:var(--text); background:#fff; font-family:inherit; }
  label.f.changed input, label.f.changed textarea { border-color:var(--primary); background:var(--primary-soft); }
  label.f.changed > span:first-child::after { content:"・已修改"; color:var(--primary); font-weight:700; }
  label.f .was { font-size:11px; color:var(--muted); }
  .chipbox { border:1px solid #cbd5e1; border-radius:6px; padding:6px; background:#fff; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chipbox.changed { border-color:var(--primary); }
  .chipbox input { border:0; outline:0; font-size:13px; flex:1; min-width:120px; padding:4px; }
  .chip { font-size:12px; border:1px solid #cbd5e1; border-radius:6px; padding:3px 8px; background:#fff; white-space:nowrap; }
  .chip.add { background:var(--add); border-color:#86efac; color:var(--addt); }
  .chip.del { background:var(--del); border-color:#fca5a5; color:var(--delt); text-decoration:line-through; }
  .chip.code { font-weight:700; background:#e5e7eb; border-color:#e5e7eb; }
  .chip x { margin-left:4px; color:var(--muted); cursor:pointer; }
  .linkrow { display:grid; grid-template-columns:180px 1fr 32px; gap:8px; align-items:center; margin-bottom:8px; }
  .mobile .linkrow { grid-template-columns:1fr 32px; } .mobile .linkrow label:first-child { grid-column:1 / -1; }
  .linkrow.added input { border-color:var(--primary); background:var(--primary-soft); }
  .iconbtn { width:32px; height:36px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:var(--muted); }
  .textbtn { border:1px dashed #94a3b8; background:#fff; border-radius:6px; padding:7px 12px; font-size:13px; color:var(--primary); font-weight:700; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .btn { border:0; border-radius:6px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; background:var(--primary); color:#fff; white-space:nowrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #cbd5e1; }
  .btn.outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.danger { background:#b91c1c; }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .alert { font-size:13px; border-radius:8px; padding:10px 12px; margin-bottom:12px; line-height:1.6; }
  .alert.warn { background:var(--warn); border:1px solid var(--warnb); color:var(--warnt); }
  .alert.info { background:#eff6ff; border:1px solid #93c5fd; color:#1e3a8a; }
  .alert.ok { background:var(--add); border:1px solid #86efac; color:var(--addt); }
  .alert a { color:inherit; font-weight:700; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:12px; gap:4px; }
  .tabs a { padding:10px 14px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs a.on { color:var(--primary); border-color:var(--primary); font-weight:700; }
  .badge { display:inline-block; white-space:nowrap; font-size:11px; border-radius:4px; padding:1px 6px; font-weight:700; }
  .badge.pending { background:var(--warn); color:var(--warnt); } .badge.approved { background:var(--add); color:var(--addt); } .badge.rejected { background:var(--del); color:var(--delt); }
  .badge.mcp { background:#e5e7eb; color:#374151; } .badge.conflict { background:#ffedd5; color:#9a3412; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:700; font-size:12px; background:#f9fafb; }
  tr.click:hover td { background:#f9fafb; cursor:pointer; }
  td.cur { color:var(--delt); } td.new { color:var(--addt); font-weight:700; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  /* 後台 layout */
  .admin { display:grid; grid-template-columns:200px 1fr; min-height:600px; }
  .side { background:#fff; border-right:1px solid var(--line); padding:12px 0; font-size:14px; }
  .side .g { font-size:12px; color:var(--muted); font-weight:700; padding:12px 16px 4px; }
  .side a { display:flex; justify-content:space-between; padding:8px 16px; color:var(--text); text-decoration:none; }
  .side a.on { background:var(--primary-soft); color:var(--primary); font-weight:700; border-right:3px solid var(--primary); }
  .side a.new::after { content:"NEW"; font-size:10px; color:#fff; background:#2563eb; border-radius:3px; padding:0 4px; margin-left:6px; line-height:18px; }
  .side .count { background:var(--warn); color:var(--warnt); border-radius:10px; padding:0 7px; font-size:12px; font-weight:700; }
  /* 詳細頁 */
  .detail { display:grid; grid-template-columns:320px 1fr; gap:28px; }
  .mobile .detail { grid-template-columns:1fr; }
  .detail .cover { width:100%; }
  .mobile .detail .cover { max-width:220px; margin:0 auto; }
  .detail .meta { border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:24px 0; display:flex; flex-direction:column; justify-content:space-between; gap:20px; }
  .detail h1 { font-size:26px; margin:10px 0 0; line-height:1.25; } .mobile .detail h1 { font-size:20px; }
  .info { border:1px solid var(--line); border-radius:10px; background:#fff; margin-top:20px; }
  .info .r { display:grid; grid-template-columns:96px 1fr; gap:16px; padding:13px 18px; border-top:1px solid var(--line); font-size:14px; }
  .mobile .info .r { grid-template-columns:64px 1fr; gap:8px; }
  .info .r:first-child { border-top:0; } .info .r b { color:var(--muted); }
  .info a { color:#1d4ed8; }
  .hl { outline:3px dashed #2563eb; outline-offset:3px; border-radius:6px; }
  .note { font-size:12px; color:#2563eb; margin-top:6px; }
  .overlay { position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:5; }
  .dialog { background:#fff; border-radius:10px; width:460px; max-width:calc(100% - 32px); padding:20px; }
  .dialog h3 { margin:0 0 12px; }
  .quick { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .quick span { font-size:12px; border:1px solid #cbd5e1; border-radius:14px; padding:3px 10px; cursor:pointer; }
  .ac { position:relative; }
  .ac .dd { position:absolute; left:0; right:0; top:calc(100% - 18px); background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,.15); z-index:4; font-size:13px; color:var(--text); overflow:hidden; }
  .ac .dd div { display:flex; justify-content:space-between; padding:8px 12px; }
  .ac .dd div:first-child { background:#f3f4f6; }
  .ac .dd div span:last-child { color:var(--muted); }
  .ac .dd .free { border-top:1px solid var(--line); color:var(--primary); }
  .badge.newval { background:#dbeafe; color:#1d4ed8; margin-left:4px; }
  .switch { font-size:13px; display:flex; align-items:center; gap:6px; color:var(--muted); }
  .hide { display:none !important; }
</style>
</head>

<script>
  const frame = document.getElementById('frame');
  const state = { screen: 'detail', mobile: false, conflict: false, dup: false };
  function render() {
    frame.innerHTML = document.getElementById('t-' + state.screen).innerHTML;
    frame.classList.toggle('mobile', state.mobile);
    // 手機版後台側欄收起
    frame.querySelectorAll('.admin').forEach(a => { a.style.gridTemplateColumns = state.mobile ? '1fr' : ''; a.querySelector('.side').classList.toggle('hide', state.mobile); });
    frame.querySelectorAll('.conflict-box,.base-col').forEach(e => e.classList.toggle('hide', !state.conflict));
    frame.querySelectorAll('.dup-box').forEach(e => e.classList.toggle('hide', !state.dup));
    document.querySelectorAll('[data-screen]').forEach(b => b.classList.toggle('on', b.dataset.screen === state.screen));
    document.querySelectorAll('[data-device]').forEach(b => b.classList.toggle('on', (b.dataset.device === 'mobile') === state.mobile));
    document.getElementById('tgConflict').classList.toggle('on', state.conflict);
    document.getElementById('tgDup').classList.toggle('on', state.dup);
  }
  document.querySelectorAll('[data-screen]').forEach(b => b.onclick = () => { state.screen = b.dataset.screen; render(); });
  document.querySelectorAll('[data-device]').forEach(b => b.onclick = () => { state.mobile = b.dataset.device === 'mobile'; render(); });
  document.getElementById('tgConflict').onclick = () => { state.conflict = !state.conflict; state.screen = 'review'; render(); };
  document.getElementById('tgDup').onclick = () => { state.dup = !state.dup; state.screen = 'review'; render(); };
  render();
</script>
