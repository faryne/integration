<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AV 同名女優區分 mockup</title>
<style>
  :root { --bg:#f3f4f6; --paper:#fff; --line:#e5e7eb; --muted:#6b7280; --text:#111827; --primary:#2e7d6b; --primary-soft:#e6f2ef;
          --add:#e7f6ec; --addt:#166534; --del:#fdecec; --delt:#991b1b; --warn:#fef3c7; --warnb:#f59e0b; --warnt:#92400e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#d1d5db; color:var(--text); }
  .toolbar { position:sticky; top:0; z-index:20; background:#111827; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--primary); }
  .toolbar .sep { width:1px; height:20px; background:#4b5563; margin:0 4px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .stage > .frame { margin:0 auto; }
  .frame { background:var(--bg); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); width:1100px; flex:0 0 auto; position:relative; min-height:640px; }
  .frame.mobile { width:375px; }
  .nav { background:#161b22; color:#fff; height:44px; display:flex; align-items:center; padding:0 16px; font-weight:700; font-size:14px; gap:16px; position:relative; }
  .nav small { font-weight:400; color:#9ca3af; }
  .avatar { margin-left:auto; width:28px; height:28px; border-radius:50%; background:#4b5563; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; position:relative; }
  .avatar .dot { position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:#f59e0b; border:2px solid #161b22; }
  .login { margin-left:auto; font-size:12px; font-weight:400; color:#d1d5db; }
  .menu { position:absolute; right:12px; top:42px; background:#fff; color:var(--text); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,.2); width:220px; z-index:9; font-weight:400; font-size:14px; overflow:hidden; }
  .menu div { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; }
  .menu div:hover { background:#f9fafb; }
  .menu .count { background:var(--warn); color:var(--warnt); border-radius:10px; padding:0 7px; font-size:12px; font-weight:700; }
  .crumb { background:var(--paper); border-bottom:1px solid var(--line); padding:8px 16px; font-size:12px; color:var(--muted); }
  .page { padding:20px 16px 32px; }
  h2 { margin:0 0 4px; font-size:22px; } .sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .paper { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mobile .grid2, .mobile .grid4 { grid-template-columns:1fr 1fr; }
  .formlayout { display:grid; grid-template-columns:200px 1fr; gap:20px; }
  .mobile .formlayout { grid-template-columns:1fr; }
  .mobile .formlayout .photo { max-width:140px; margin:0 auto; }
  .photo { aspect-ratio:3/4; border-radius:8px; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); display:flex; align-items:flex-end; justify-content:center; font-size:12px; color:#475569; padding:8px; }
  .section { font-size:13px; font-weight:700; color:var(--muted); margin:16px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0; }
  label.f input, label.f textarea, label.f select { width:100%; border:1px solid #cbd5e1; border-radius:6px; padding:9px 10px; font-size:14px; color:var(--text); background:#fff; font-family:inherit; }
  label.f.changed input { border-color:var(--primary); background:var(--primary-soft); }
  label.f.changed > span:first-child::after { content:"・已修改"; color:var(--primary); font-weight:700; }
  label.f.error input { border-color:#dc2626; }
  label.f .was { font-size:11px; color:var(--muted); }
  label.f .err { font-size:11px; color:#dc2626; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; border:1px solid #cbd5e1; border-radius:6px; padding:3px 8px; background:#fff; }
  .chip.on { background:var(--primary); border-color:var(--primary); color:#fff; }
  .chip.add { background:var(--add); border-color:#86efac; color:var(--addt); }
  .chip.del { background:var(--del); border-color:#fca5a5; color:var(--delt); text-decoration:line-through; }
  .linkrow { display:grid; grid-template-columns:180px 1fr 32px; gap:8px; align-items:center; margin-bottom:8px; }
  .mobile .linkrow { grid-template-columns:1fr 32px; }
  .mobile .linkrow label:first-child { grid-column:1 / -1; }
  .linkrow.added input { border-color:var(--primary); background:var(--primary-soft); }
  .linkrow.removed input { text-decoration:line-through; color:var(--delt); background:var(--del); border-color:#fca5a5; }
  .iconbtn { width:32px; height:36px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; color:var(--muted); }
  .textbtn { border:1px dashed #94a3b8; background:#fff; border-radius:6px; padding:7px 12px; font-size:13px; color:var(--primary); cursor:pointer; font-weight:700; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .btn { border:0; border-radius:6px; padding:9px 16px; font-weight:700; font-size:14px; cursor:pointer; background:var(--primary); color:#fff; white-space:nowrap; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid #cbd5e1; }
  .btn.outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
  .btn.danger { background:#b91c1c; }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .alert { font-size:13px; border-radius:8px; padding:10px 12px; margin-bottom:12px; line-height:1.6; }
  .alert.warn { background:var(--warn); border:1px solid var(--warnb); color:var(--warnt); }
  .alert.info { background:#eff6ff; border:1px solid #93c5fd; color:#1e3a8a; }
  .alert a { color:inherit; font-weight:700; }
  .tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:12px; gap:4px; }
  .tabs a { padding:10px 14px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
  .tabs a.on { color:var(--primary); border-color:var(--primary); font-weight:700; }
  .badge { display:inline-block; white-space:nowrap; font-size:11px; border-radius:4px; padding:1px 6px; font-weight:700; }
  .badge.create { background:#dbeafe; color:#1d4ed8; } .badge.edit { background:#ede9fe; color:#6d28d9; }
  .badge.pending { background:var(--warn); color:var(--warnt); } .badge.approved { background:var(--add); color:var(--addt); } .badge.rejected { background:var(--del); color:var(--delt); }
  .badge.mcp { background:#e5e7eb; color:#374151; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:700; background:#f9fafb; }
  tr.row { cursor:pointer; } tr.row:hover { background:#f9fafb; }
  td.old { background:var(--del); color:var(--delt); } td.new { background:var(--add); color:var(--addt); font-weight:700; }
  td.same { color:var(--muted); } td.now { background:var(--warn); color:var(--warnt); }
  .linklist { display:flex; flex-direction:column; gap:4px; }
  .linklist span { font-size:12px; padding:2px 6px; border-radius:4px; word-break:break-all; }
  .linklist .add { background:var(--add); color:var(--addt); } .linklist .del { background:var(--del); color:var(--delt); text-decoration:line-through; }
  .diffhead { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .toggle { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .meta { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; margin:0; }
  .meta dt { color:var(--muted); } .meta dd { margin:0; word-break:break-all; }
  .reviewlayout { display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
  .mobile .reviewlayout { grid-template-columns:1fr; }
  .mobile .hide-m { display:none; }
  .dup { display:flex; gap:10px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:8px; font-size:13px; }
  .dup .thumb { width:40px; height:52px; border-radius:4px; background:#cbd5e1; flex:0 0 auto; }
  .mask { position:absolute; inset:0; background:rgba(17,24,39,.45); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .dialog { background:#fff; border-radius:12px; padding:20px; width:520px; max-width:100%; box-shadow:0 20px 40px rgba(0,0,0,.25); max-height:90%; overflow:auto; }
  .dialog h3 { margin:0 0 8px; font-size:18px; }
  .dialog p { font-size:14px; color:#374151; line-height:1.6; margin:0 0 12px; }
  .opt { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; cursor:pointer; font-size:14px; }
  .opt.on { border-color:var(--primary); background:var(--primary-soft); }
  .opt.disabled { opacity:.5; cursor:not-allowed; }
  .opt small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .done { text-align:center; padding:40px 16px; } .done .icon { font-size:44px; }
  .detail { display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; }
  .mobile .detail { grid-template-columns:1fr; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h4 { margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .reflinks a { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; color:#1d4ed8; text-decoration:none; border-bottom:1px solid var(--line); word-break:break-all; }
  .reflinks a:last-child { border-bottom:0; }
  .reflinks a small { color:var(--muted); margin-left:auto; font-size:11px; white-space:nowrap; }
  .results { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .mobile .results { grid-template-columns:repeat(2,1fr); }
  .acard { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; }
  .acard .photo { border-radius:0; } .acard p { margin:6px 8px 8px; }
  .hl { outline:3px solid #f59e0b; outline-offset:2px; border-radius:6px; }
</style>
<style>
  .samename { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .samename b { font-size:13px; }
  .sn { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; border:1px solid var(--line); margin-top:8px; cursor:pointer; font-size:13px; text-decoration:none; color:inherit; }
  .sn:hover { background:#f9fafb; }
  .sn.on { border-color:var(--primary); background:var(--primary-soft); cursor:default; }
  .sn .thumb { width:36px; height:48px; border-radius:4px; background:#cbd5e1; flex:0 0 auto; }
  .sn small { color:var(--muted); display:block; }
  .url { font-family:ui-monospace,monospace; font-size:12px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 10px; margin-bottom:12px; color:#374151; word-break:break-all; }
  .vgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .mobile .vgrid { grid-template-columns:repeat(2,1fr); }
  .vcard { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; }
  .vcard .cover { aspect-ratio:16/10; background:repeating-linear-gradient(45deg,#cbd5e1 0 10px,#d8dee8 10px 20px); }
  .vcard p { margin:6px 8px 8px; }
  .vcard .tag { font-size:10px; border-radius:4px; padding:0 5px; font-weight:700; }
  .vcard .tag.legacy { background:#e5e7eb; color:#374151; } .vcard .tag.mine { background:var(--add); color:var(--addt); }
  .note { font-size:12px; color:#1e3a8a; background:#eff6ff; border:1px dashed #93c5fd; border-radius:8px; padding:8px 10px; margin-top:16px; line-height:1.7; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar"></div>
<div class="stage"><div class="frame" id="frame"></div></div>
<script>
  // ===== 假資料：xcity 上兩位「七瀬くるみ」=====
  const KURUMI = [
    { key:"xcity-1201", kana:"ななせくるみ", birth:"1984/10/3", y:1984, cup:"D", height:158, b:85, w:58, h:86, dmm:"" },
    { key:"xcity-20877", kana:"ななせくるみ", birth:"2001/2/14", y:2001, cup:"G", height:152, b:92, w:57, h:88, dmm:"1075832" },
  ];
  const state = { screen:"detail", mobile:false, who:1, viaOld:false, dialog:null, choice:"" };
  const SCREENS = [["detail","女優頁（同名切換）"],["review-create","審核：新增單同名"]];

  function go(screen) { Object.assign(state, { screen, dialog:null }); render(); }
  function set(k, v) { state[k] = v; render(); }
  const nav = () => `<div class="nav">Faryne 的實驗室 <small>大人的喜好</small><div class="avatar">F</div></div>`;
  const shell = (crumb, body) => `${nav()}<div class="crumb">${crumb}</div><div class="page">${body}</div>`;
  const summary = (a) => [a.y && `${a.y} 年生`, a.cup && `${a.cup} cup`, a.height && `${a.height}cm`].filter(Boolean).join("・");

  function toolbar() {
    return `<b>同名女優區分 mockup</b><span class="sep"></span>` +
      SCREENS.map(([k, t]) => `<button class="${state.screen === k ? "on" : ""}" onclick="go('${k}')">${t}</button>`).join("") +
      `<span class="sep"></span><button class="${state.mobile ? "" : "on"}" onclick="set('mobile',false)">桌機</button><button class="${state.mobile ? "on" : ""}" onclick="set('mobile',true)">手機</button>`;
  }

  // ===== 女優頁：同名切換放在資料卡上方，只有兩位以上才出現 =====
  function detail() {
    const a = KURUMI[state.who];
    const url = state.viaOld ? "/av/actress/七瀬くるみ" : state.viaDmm ? "/av/actress/七瀬くるみ?dmm_id=1075832" : `/av/actress/七瀬くるみ?xcity_id=${a.key.split("-")[1]}`;
    const switcher = `<div class="samename"><b>可能同名的女優</b>${KURUMI.map((x, i) =>
      `<a class="sn ${i === state.who ? "on" : ""}" onclick="Object.assign(state,{who:${i},viaOld:false,viaDmm:false});render()"><div class="thumb"></div><div>七瀬くるみ<small>${summary(x)}</small></div></a>`).join("")}</div>`;
    const videos = (state.who === 1
      ? [["2026/10/28 新作","mine"],["2026/10/15 新作","mine"],["2019 舊作","legacy"],["1998 舊作","legacy"]]
      : [["2019 舊作","legacy"],["1998 舊作","legacy"],["2026/10/20 新作（另一位 DMM ID 不在名單）","mine"]]);
    return shell("首頁 / AV 女優搜尋 / 七瀬くるみ", `
      <div class="url">${url}</div>
      <div class="detail">
        <div style="display:flex;flex-direction:column;gap:12px">
          ${switcher}
          <div class="card" style="text-align:center">
            <div class="photo" style="max-width:200px;margin:0 auto 12px">照片</div>
            <b style="font-size:18px">七瀬くるみ</b><div style="color:var(--muted);font-size:13px">${a.kana}</div>
            <div style="text-align:left;font-size:14px;line-height:1.9;margin-top:8px">三圍：B${a.b}（${a.cup}）W${a.w} H${a.h}<br>生日：${a.birth}<br>身高：${a.height} cm</div>
            <button class="btn outline sm" style="margin-top:10px">✎ 修改資料</button>
          </div>
        </div>
        <div>
          <b style="font-size:18px">出演影片</b><div style="color:var(--muted);font-size:13px;margin-bottom:12px">共 ${videos.length} 筆資料</div>
          <div class="vgrid">${videos.map(([t, k]) => `<div class="vcard"><div class="cover"></div><p>${t}<br><span class="tag ${k}">${k === "mine" ? "ID 相符" : "舊資料：照名字"}</span></p></div>`).join("")}</div>
        </div>
      </div>
      <div class="note">
        mockup 說明（實作不顯示）：<br>
        ・站內連結帶 <code>?xcity_id=</code>／<code>?manual_id=</code>；<a href="#" onclick="Object.assign(state,{who:0,viaOld:true,viaDmm:false});render();return false">用舊網址進來</a> 會顯示排第一的那位，網址不改。<br>
        ・<a href="#" onclick="Object.assign(state,{who:1,viaOld:false,viaDmm:true});render();return false">從新影片的出演 chip 進來</a>（<code>?dmm_id=</code>），查對照表對到 xcity-20877。<br>
        ・影片卡上的「ID 相符／舊資料」標籤只是讓你看懂分流規則，實作不加。<br>
        ・只有一位時不顯示「同名女優」卡；搜尋結果頁只改連結，畫面不變。
      </div>`);
  }

  // ===== 審核頁：新增單同名 → 合併或新增為另一位 =====
  function reviewCreate() {
    return shell("首頁 / AV 女優上稿審核 / #1090", `
      <div class="pagehead"><div><h2>#1090 新增：七瀬くるみ</h2><p class="sub">網頁・匿名（IP 77d0…）・10/31 11:40</p></div></div>
      <div class="reviewlayout">
        <div class="paper"><div class="alert warn"><b>已有同名女優：</b>七瀬くるみ（2 位）。</div>
          <table><tr><th>欄位</th><th>提交</th></tr><tr><td>生日</td><td class="new">2006/5/1</td></tr><tr><td>罩杯</td><td class="new">E</td></tr></table></div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="paper"><b style="font-size:13px">同名女優</b>${KURUMI.map((x) => `<div class="dup"><div class="thumb"></div><div>七瀬くるみ<br><small style="color:var(--muted)">${x.key}・${summary(x)}</small></div></div>`).join("")}</div>
          <div class="paper" style="display:flex;gap:8px"><button class="btn danger" style="flex:1">否決</button><button class="btn" style="flex:1" onclick="set('dialog','approve')">核准</button></div>
        </div>
      </div>`);
  }
  function dialog() {
    if (state.dialog !== "approve") return "";
    const opt = (k, title) => `<div class="opt ${state.choice === k ? "on" : ""}" onclick="set('choice','${k}')"><input type="radio" ${state.choice === k ? "checked" : ""}><div>${title}</div></div>`;
    const label = state.choice === "new" ? "新增並核准" : "合併並核准";
    return `<div class="mask"><div class="dialog"><h3>核准：已有同名女優</h3>
      ${KURUMI.map((x) => opt(x.key, `合併到「七瀬くるみ」（${x.key}・${summary(x)}）`)).join("")}
      ${opt("new", "新增為另一位女優")}
      <p style="font-size:13px;color:var(--muted);margin-top:8px">合併：有填的欄位覆寫、沒填的保留原值，興趣與參考連結合併。</p>
      <div class="btns"><button class="btn ghost" onclick="set('dialog',null)">取消</button><button class="btn" ${state.choice ? "" : "disabled"} onclick="go('review-create')">${label}</button></div></div></div>`;
  }

  function render() {
    document.getElementById("toolbar").innerHTML = toolbar();
    const frame = document.getElementById("frame");
    frame.className = "frame" + (state.mobile ? " mobile" : "");
    const views = { detail, "review-create": reviewCreate };
    frame.innerHTML = views[state.screen]() + dialog();
  }
  render();
</script>
</body>
</html>
