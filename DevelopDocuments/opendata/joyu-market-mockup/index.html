<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joyu.fyi 女優股市 mockup</title>
<style>
  :root {
    --plum:#2b1d2e; --plum-deep:#1c1420; --pink:#ff5c8a; --pink-strong:#d63a6c;
    --bg:#faf7f9; --paper:#fff; --line:#ece4ea; --text:#2a1f2c; --muted:#7a6a77; --chip:#f6eef3;
    --up:#e0245e; --down:#1a9e6b; --flat:#7a6a77;
  }
  .dark { --bg:#17111a; --paper:#221a25; --line:#3a2e3d; --text:#f3e6ef; --muted:#b39fb0; --chip:#2e2431; --pink-strong:#ff5c8a; --up:#ff6b8f; --down:#3ccf91; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#cfc6cd; }
  .toolbar { position:sticky; top:0; z-index:40; background:#111; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#3a3a3a; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--pink); }
  .toolbar .sep { width:1px; height:20px; background:#555; margin:0 4px; }
  .toolbar .label { color:#aaa; margin-right:2px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .frame { margin:0 auto; background:var(--bg); color:var(--text); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.25); width:1280px; flex:0 0 auto; }
  .frame.mobile { width:375px; }

  .header { background:var(--plum); color:#f3e6ef; height:56px; display:flex; align-items:center; gap:18px; padding:0 20px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; }
  .logo { width:28px; height:28px; border-radius:6px; background:var(--plum-deep); color:var(--pink); display:grid; place-items:center; font-size:17px; border:1px solid #4a3550; }
  .nav { display:flex; height:100%; }
  .nav a { display:flex; align-items:center; padding:0 12px; font-size:14px; color:#e7d5e1; position:relative; white-space:nowrap; }
  .nav a.on { color:var(--pink); }
  .nav a.on::after { content:""; position:absolute; left:10px; right:10px; bottom:0; height:2px; background:var(--pink); }
  .hright { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .hsearch { background:rgba(255,255,255,.08); border:1px solid #4a3550; border-radius:8px; padding:6px 10px; width:260px; color:#b39fb0; font-size:13px; }
  .loginbtn { border:1px solid #4a3550; border-radius:8px; padding:6px 12px; color:#f3e6ef; font-size:13px; white-space:nowrap; }
  .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#ff9fbd,#7a4a8a); border:2px solid #4a3550; }
  .mobile .hsearch, .mobile .brand span { display:none; }
  .mobile .header { gap:4px; padding:0 8px; }
  .mobile .nav a { padding:0 6px; font-size:13px; }

  .crumb { background:var(--paper); border-bottom:1px solid var(--line); padding:8px 20px; font-size:12px; color:var(--muted); }
  .crumb b { color:var(--text); }
  .page { padding:20px; }
  .mobile .page { padding:14px 12px; }
  .url { font-family:ui-monospace,monospace; font-size:12px; background:var(--paper); border:1px dashed var(--line); border-radius:6px; padding:6px 10px; margin-bottom:14px; color:var(--muted); }
  .note { background:#fff8db; color:#7a5b00; border:1px solid #f1d77a; border-radius:8px; padding:8px 12px; font-size:12px; margin-bottom:14px; line-height:1.6; }
  .dark .note { background:#3a3218; color:#f1d77a; border-color:#6b5a1f; }
  .footer { background:var(--plum-deep); color:#9c8798; font-size:13px; padding:18px 20px; margin-top:12px; }

  .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  .grid { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; align-items:start; }
  .mobile .grid { grid-template-columns:minmax(0,1fr); gap:12px; }
  .stack { display:flex; flex-direction:column; gap:16px; }
  .mobile .stack { gap:12px; }
  .row { display:flex; align-items:center; gap:10px; }
  .muted { color:var(--muted); }
  .small { font-size:12px; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--flat); }
  .num { font-variant-numeric:tabular-nums; }
  .btn { border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer; background:var(--pink); color:#fff; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:500; }
  .btn.sell { background:var(--down); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .chip { display:inline-block; background:var(--chip); border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--pink); color:#fff; }
  .badge { font-size:11px; font-weight:700; border-radius:4px; padding:1px 6px; }
  .badge.limitup { background:var(--up); color:#fff; } .badge.limitdown { background:var(--down); color:#fff; }
  .pic { width:36px; height:48px; border-radius:6px; flex:0 0 auto; display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; }
  .pic.lg { width:84px; height:112px; font-size:26px; border-radius:10px; }

  /* 大盤 */
  .index { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .index .big { font-size:30px; font-weight:800; }
  .mobile .index { gap:10px; } .mobile .index .big { font-size:24px; }
  .kv { display:flex; flex-direction:column; gap:2px; }
  .kv b { font-size:15px; }

  /* 列表 */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:right; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, th.l, td.l { text-align:left; }
  td { padding:8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--chip); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
  .filter { margin-left:auto; border:1px solid var(--line); background:var(--bg); color:var(--muted); border-radius:8px; padding:5px 10px; font-size:13px; width:200px; }
  .mobile .filter { margin-left:0; width:100%; }
  .mlist .item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .mlist .item:last-child { border-bottom:0; }
  .mlist .item .name { flex:1; min-width:0; }
  .mlist .item .px { text-align:right; }

  /* 個股 */
  .quote { display:flex; gap:16px; align-items:flex-start; }
  .quote .price { font-size:34px; font-weight:800; line-height:1.1; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:12px; }
  .mobile .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .stat { background:var(--chip); border-radius:8px; padding:8px 10px; }
  .stat .k { font-size:11px; color:var(--muted); } .stat .v { font-size:15px; font-weight:700; }
  .chart svg { width:100%; height:220px; display:block; }
  .tradebox .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--chip); border-radius:8px; padding:3px; margin-bottom:12px; }
  .tradebox .seg div { text-align:center; padding:7px; border-radius:6px; font-size:14px; cursor:pointer; }
  .tradebox .seg .on.buy { background:var(--pink); color:#fff; } .tradebox .seg .on.sell { background:var(--down); color:#fff; }
  .tradebox input { width:100%; font-size:18px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  .qty { display:flex; gap:6px; margin:8px 0 12px; }
  .qline { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .qline.total { border-top:1px solid var(--line); margin-top:4px; padding-top:8px; font-weight:700; font-size:15px; }
  .videos { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
  .mobile .videos { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .vcover { aspect-ratio:3/4; border-radius:6px; background:linear-gradient(160deg,#8a6a92,#3a2840); }
  .vtitle { font-size:11px; color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 持股、排行 */
  .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .mobile .summary { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .summary .card .v { font-size:22px; font-weight:800; margin-top:4px; }
  .mobile .summary .card .v { font-size:17px; }
  .rank { width:28px; text-align:center; font-weight:800; }
  .me td { background:rgba(255,92,138,.08); }
  .scroll { overflow-x:auto; }
  .login-cta { text-align:center; padding:18px 12px; }
</style>
</head>
<body>
<div class="toolbar">
  <span class="label">頁面</span>
  <button data-page="market" class="on">股市總覽</button>
  <button data-page="stock">個股</button>
  <button data-page="portfolio">我的持股</button>
  <button data-page="leaderboard">排行榜</button>
  <span class="sep"></span>
  <span class="label">帳號</span>
  <button data-acct="none">未登入</button>
  <button data-acct="anon">匿名</button>
  <button data-acct="google" class="on">Google</button>
  <span class="sep"></span>
  <span class="label">個股狀態</span>
  <button data-st="normal" class="on">一般</button>
  <button data-st="limitup">漲停</button>
  <button data-st="t1">今天剛買（T+1）</button>
  <span class="sep"></span>
  <button id="dark">深色</button>
  <button id="mobile">手機</button>
</div>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
// ── 假資料：名字取自 P0 dry-run 前段，價格隨機但固定 ──
const names = ["波多野結衣","美園和花","天馬ゆい","沙月恵奈","新村あかり","森沢かな","椿りか","乙アリス","皆月ひかる","木下ひまり","末広純","柏木こなつ","倉本すみれ","美咲かんな","逢沢みゆ","羽月乃蒼","松本いちか","北岡果林","月野かすみ","浜崎真緒"];
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const hues = [330, 290, 350, 260, 10, 310, 280, 340];
const stocks = names.map((n, i) => {
  const prev = +(8 + rnd() * 18).toFixed(2);
  const chg = (rnd() - 0.42) * 0.16;
  return { code: "J" + String(i + 1).padStart(4, "0"), name: n, prev, price: +(prev * (1 + chg)).toFixed(2), vol: Math.round(rnd() * 4000), v90: Math.round(10 + rnd() * 45), hue: hues[i % hues.length] };
});
stocks[3].price = +(stocks[3].prev * 1.2).toFixed(2); // 漲停的那檔
const S = { page: "market", acct: "google", st: "normal", dark: false, mobile: false, sort: "up", side: "buy" };
const fmt = (n, d = 2) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = s => (s.price - s.prev) / s.prev * 100;
const cls = v => v > 0.0001 ? "up" : v < -0.0001 ? "down" : "flat";
const sign = v => (v > 0 ? "▲ +" : v < 0 ? "▼ " : "") + fmt(v) + "%";
const pic = (s, lg) => `<div class="pic${lg ? " lg" : ""}" style="background:linear-gradient(160deg,hsl(${s.hue} 55% 65%),hsl(${s.hue} 40% 35%))">${s.name[0]}</div>`;
const limitBadge = s => pct(s) >= 19.99 ? `<span class="badge limitup">漲停</span>` : pct(s) <= -19.99 ? `<span class="badge limitdown">跌停</span>` : "";

function header() {
  const right = S.acct === "google" ? `<div class="avatar"></div>` : `<span class="loginbtn">登入</span>`;
  return `<div class="header"><div class="brand"><div class="logo">女</div><span>joyu.fyi</span></div>
    <nav class="nav"><a>女優</a><a>女優主題</a><a>影片</a><a>即將發售</a><a class="on">股市</a></nav>
    <div class="hright"><div class="hsearch">🔍 名字、別名或番號</div>${right}<span class="loginbtn">◐</span></div></div>`;
}
const crumb = parts => `<div class="crumb">joyu.fyi / ${parts.map((p, i) => i === parts.length - 1 ? `<b>${p}</b>` : p).join(" / ")}</div>`;

// 右欄／手機版的「我的資產」：未登入與匿名都只給 Google 登入按鈕
function assetCard() {
  if (S.acct !== "google") return `<div class="card login-cta"><h3>開戶</h3><button class="btn">用 Google 登入</button></div>`;
  return `<div class="card"><h3>我的資產</h3>
    <div class="qline"><span class="muted">現金</span><span class="num">${fmt(61240.5)}</span></div>
    <div class="qline"><span class="muted">持股市值</span><span class="num">${fmt(43980.2)}</span></div>
    <div class="qline total"><span>總資產</span><span class="num">${fmt(105220.7)} <span class="up small">+5.22%</span></span></div>
    <div style="margin-top:10px"><a class="small" style="color:var(--pink)">我的持股 →</a></div></div>`;
}
function miniBoard() {
  const rows = [["ねこ投資部", 182340.1], ["匿名#4821", 151002.4], ["しずか", 139870], ["匿名#0937", 128450.9], ["無敵の株主", 121300.3]];
  return `<div class="card"><h3>排行榜</h3>${rows.map((r, i) => `<div class="qline"><span><b>${i + 1}</b>&nbsp; ${r[0]}</span><span class="num">${fmt(r[1], 0)}</span></div>`).join("")}
    <div style="margin-top:8px"><a class="small" style="color:var(--pink)">看全部 →</a></div></div>`;
}

function marketPage() {
  const sorted = [...stocks].sort((a, b) => S.sort === "up" ? pct(b) - pct(a) : S.sort === "down" ? pct(a) - pct(b) : S.sort === "vol" ? b.vol - a.vol : a.code.localeCompare(b.code));
  const tabs = [["up", "漲幅"], ["down", "跌幅"], ["vol", "成交量"], ["all", "全部"]].map(([k, l]) => `<span class="chip${S.sort === k ? " on" : ""}" data-sort="${k}">${l}</span>`).join("");
  const list = S.mobile
    ? `<div class="mlist">${sorted.map(s => `<div class="item click" data-go="stock">${pic(s)}<div class="name"><div><b>${s.name}</b> ${limitBadge(s)}</div><div class="small muted">${s.code}・量 ${s.vol}</div></div><div class="px num"><div><b>${fmt(s.price)}</b></div><div class="small ${cls(pct(s))}">${sign(pct(s))}</div></div></div>`).join("")}</div>`
    : `<table><thead><tr><th class="l">代碼</th><th class="l">女優</th><th>現價</th><th>漲跌</th><th>成交量</th><th>近 90 天出片</th></tr></thead><tbody>
      ${sorted.map(s => `<tr class="click" data-go="stock"><td class="l muted num">${s.code}</td><td class="l"><div class="row">${pic(s)}<b>${s.name}</b>${limitBadge(s)}</div></td><td class="num"><b>${fmt(s.price)}</b></td><td class="num ${cls(pct(s))}">${sign(pct(s))}</td><td class="num">${s.vol.toLocaleString()}</td><td class="num">${s.v90}</td></tr>`).join("")}
      </tbody></table>`;
  return crumb(["股市"]) + `<div class="page"><div class="url">/market</div>
    <div class="stack">
      <div class="card index"><div><div class="small muted">joyu 指數</div><div class="big num">1,034.52 <span class="up" style="font-size:16px">▲ +1.18%</span></div></div>
        <div class="kv"><span class="small muted">上市</span><b class="num">529 檔</b></div>
        <div class="kv"><span class="small muted">今日成交量</span><b class="num">48,210 股</b></div>
        <div class="kv"><span class="small muted">上漲／下跌</span><b class="num"><span class="up">212</span>／<span class="down">187</span></b></div></div>
      <div class="grid">
        <div class="card"><div class="tabs">${tabs}<input class="filter" placeholder="名字或代碼"></div>${list}</div>
        <div class="stack">${assetCard()}${miniBoard()}</div>
      </div>
    </div></div>`;
}

// 個股走勢：90 天收盤線＋有新片的日子打點（手機版交易面板放在報價卡下面，不用捲過走勢圖才找得到）
function chartSvg(s) {
  // 從 IPO 價 10 走到現價，中間加一點雜訊
  let pts = [], marks = [];
  for (let i = 0; i < 90; i++) { pts.push((10 + (s.prev - 10) * (i / 88)) * (1 + (rnd() - 0.5) * 0.06)); if (rnd() < 0.18) marks.push(i); }
  pts[88] = s.prev; pts[89] = s.price;
  const max = Math.max(...pts) * 1.05, min = Math.min(...pts) * 0.95, W = 900, H = 220;
  const xy = (v, i) => [i / 89 * W, H - (v - min) / (max - min) * H];
  const d = pts.map((v, i) => (i ? "L" : "M") + xy(v, i).map(n => n.toFixed(1)).join(" ")).join("");
  const dots = marks.map(i => { const [x, y] = xy(pts[i], i); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--pink)"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--up)" stroke-width="2" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
}

function tradeBox(s) {
  const limit = S.st === "limitup";
  const t1 = S.st === "t1";
  if (S.acct !== "google") return `<div class="card tradebox login-cta"><h3>交易</h3><button class="btn">用 Google 登入後交易</button></div>`;
  const buy = S.side === "buy";
  const seg = `<div class="seg"><div class="buy${buy ? " on" : ""}" data-side="buy">買進</div><div class="sell${!buy ? " on" : ""}" data-side="sell">賣出</div></div>`;
  if (buy) {
    const disabled = limit;
    return `<div class="card tradebox"><h3>交易</h3>${seg}
      <input value="${limit ? 0 : 100}" ${disabled ? "disabled" : ""}>
      <div class="qty"><span class="chip">10</span><span class="chip">100</span><span class="chip">1000</span><span class="chip">最多 ${limit ? 0 : "2,310"}</span></div>
      <div class="qline"><span class="muted">均價</span><span class="num">${limit ? "—" : fmt(s.price * 1.0025)}</span></div>
      <div class="qline"><span class="muted">手續費 1%</span><span class="num">${limit ? "—" : fmt(s.price * 100 * 0.01)}</span></div>
      <div class="qline"><span class="muted">買完後股價</span><span class="num">${limit ? "—" : fmt(s.price * 1.005)}</span></div>
      <div class="qline total"><span>合計</span><span class="num">${limit ? "—" : fmt(s.price * 100 * 1.0125)}</span></div>
      <button class="btn" style="width:100%;margin-top:10px" ${disabled ? "disabled" : ""}>${limit ? "已漲停" : "買進"}</button>
      <div class="small muted" style="margin-top:6px">現金 ${fmt(61240.5)}</div></div>`;
  }
  const own = 300, locked = t1 ? 100 : 0;
  return `<div class="card tradebox"><h3>交易</h3>${seg}
    <input value="${own - locked}">
    <div class="qty"><span class="chip">10</span><span class="chip">100</span><span class="chip">全部 ${own - locked}</span></div>
    <div class="qline"><span class="muted">均價</span><span class="num">${fmt(s.price * 0.9925)}</span></div>
    <div class="qline"><span class="muted">手續費 1%</span><span class="num">${fmt(s.price * (own - locked) * 0.01)}</span></div>
    <div class="qline"><span class="muted">賣完後股價</span><span class="num">${fmt(s.price * 0.985)}</span></div>
    <div class="qline total"><span>入帳</span><span class="num">${fmt(s.price * (own - locked) * 0.98)}</span></div>
    <button class="btn sell" style="width:100%;margin-top:10px">賣出</button>
    <div class="small muted" style="margin-top:6px">可賣 ${own - locked} 股${locked ? `・今天買的 ${locked} 股明天可賣` : ""}</div></div>`;
}

function stockPage() {
  const s = S.st === "limitup" ? stocks[3] : stocks[0];
  const p = pct(s);
  const trades = Array.from({ length: 6 }, (_, i) => ({ t: `14:${String(52 - i * 7).padStart(2, "0")}`, buy: rnd() > 0.4, q: Math.round(10 + rnd() * 400), px: s.price * (1 - i * 0.003) }));
  const holding = S.acct === "google" ? `<div class="card"><h3>我的持股</h3>
      <div class="qline"><span class="muted">股數</span><span class="num">300${S.st === "t1" ? `（今天買 100）` : ""}</span></div>
      <div class="qline"><span class="muted">平均成本</span><span class="num">${fmt(s.prev * 0.93)}</span></div>
      <div class="qline"><span class="muted">市值</span><span class="num">${fmt(s.price * 300)}</span></div>
      <div class="qline total"><span>損益</span><span class="num up">+${fmt(s.price * 300 - s.prev * 0.93 * 300)}（+${fmt((s.price / (s.prev * 0.93) - 1) * 100)}%）</span></div></div>` : "";
  return crumb(["股市", `${s.code} ${s.name}`]) + `<div class="page"><div class="url">/market/${s.code}</div>
    <div class="grid">
      <div class="stack">
        <div class="card">
          <div class="quote">${pic(s, true)}<div style="flex:1;min-width:0">
            <div class="row"><b style="font-size:20px">${s.name}</b><span class="muted num">${s.code}</span>${limitBadge(s)}</div>
            <div class="small" style="margin:2px 0 8px"><a style="color:var(--pink)">女優頁 →</a></div>
            <div class="price num">${fmt(s.price)} <span class="${cls(p)}" style="font-size:17px">${sign(p)}</span></div>
            <div class="small muted num">昨收 ${fmt(s.prev)}・漲停 ${fmt(s.prev * 1.2)}・跌停 ${fmt(s.prev * 0.8)}</div></div></div>
          <div class="stats">
            <div class="stat"><div class="k">近 90 天出片</div><div class="v num">${s.v90} 部</div></div>
            <div class="stat"><div class="k">今日新片</div><div class="v num">2 部</div></div>
            <div class="stat"><div class="k">流通股數</div><div class="v num">18,420</div></div>
            <div class="stat"><div class="k">今日成交量</div><div class="v num">${s.vol.toLocaleString()}</div></div>
          </div>
        </div>
        ${S.mobile ? tradeBox(s) : ""}
        <div class="card chart"><div class="tabs"><span class="chip">30 天</span><span class="chip on">90 天</span><span class="chip">1 年</span><span class="small muted" style="margin-left:auto">● 有新片</span></div>${chartSvg(s)}</div>
        <div class="card"><h3>近期新片</h3><div class="videos">${Array.from({ length: S.mobile ? 3 : 6 }, (_, i) => `<div><div class="vcover"></div><div class="vtitle">${["SSIS-","MIDV-","IPZZ-","STARS-","FSDSS-","CAWD-"][i]}${100 + i * 37}</div></div>`).join("")}</div></div>
      </div>
      <div class="stack">
        ${S.mobile ? "" : tradeBox(s)}
        ${holding}
        <div class="card"><h3>最近成交</h3>${trades.map(t => `<div class="qline"><span class="muted num">${t.t}</span><span class="${t.buy ? "up" : "down"}">${t.buy ? "買" : "賣"}</span><span class="num">${t.q} 股</span><span class="num">${fmt(t.px)}</span></div>`).join("")}</div>
      </div>
    </div></div>`;
}

function portfolioPage() {
  if (S.acct !== "google") return crumb(["我的持股"]) + `<div class="page"><div class="url">/me/portfolio</div><div class="card login-cta"><h3>我的持股</h3><button class="btn">用 Google 登入</button></div></div>`;
  const hold = stocks.slice(0, 5).map((s, i) => ({ s, q: [300, 120, 80, 1000, 45][i], cost: s.prev * (0.85 + i * 0.07), lock: i === 0 && S.st === "t1" ? 100 : 0 }));
  const rows = S.mobile
    ? `<div class="mlist">${hold.map(h => { const g = (h.s.price / h.cost - 1) * 100; return `<div class="item click" data-go="stock">${pic(h.s)}<div class="name"><b>${h.s.name}</b><div class="small muted">${h.q} 股${h.lock ? `（${h.lock} 股明天可賣）` : ""}・成本 ${fmt(h.cost)}</div></div><div class="px num"><div><b>${fmt(h.s.price * h.q)}</b></div><div class="small ${cls(g)}">${sign(g)}</div></div></div>`; }).join("")}</div>`
    : `<table><thead><tr><th class="l">女優</th><th>股數</th><th>可賣</th><th>平均成本</th><th>現價</th><th>市值</th><th>損益</th></tr></thead><tbody>${hold.map(h => { const g = (h.s.price / h.cost - 1) * 100; return `<tr class="click" data-go="stock"><td class="l"><div class="row">${pic(h.s)}<div><b>${h.s.name}</b><div class="small muted">${h.s.code}</div></div></div></td><td class="num">${h.q}</td><td class="num">${h.q - h.lock}</td><td class="num">${fmt(h.cost)}</td><td class="num">${fmt(h.s.price)}</td><td class="num">${fmt(h.s.price * h.q)}</td><td class="num ${cls(g)}">${sign(g)}</td></tr>`; }).join("")}</tbody></table>`;
  const trades = Array.from({ length: 6 }, (_, i) => { const s = stocks[i % 5]; const buy = i % 3 !== 1; const q = [100, 50, 300, 20, 80, 10][i]; return `<tr><td class="l muted num">11/${12 - Math.floor(i / 2)} ${String(20 - i).padStart(2, "0")}:15</td><td class="l">${s.name}</td><td class="${buy ? "up" : "down"}">${buy ? "買進" : "賣出"}</td><td class="num">${q}</td><td class="num">${fmt(s.prev)}</td><td class="num">${fmt(s.prev * q * 0.01)}</td><td class="num">${buy ? "-" : "+"}${fmt(s.prev * q * (buy ? 1.01 : 0.99))}</td></tr>`; }).join("");
  return crumb(["我的持股"]) + `<div class="page"><div class="url">/me/portfolio</div><div class="stack">
    <div class="summary">
      <div class="card"><div class="small muted">總資產</div><div class="v num">${fmt(105220.7)}</div></div>
      <div class="card"><div class="small muted">報酬率</div><div class="v num up">+5.22%</div></div>
      <div class="card"><div class="small muted">現金</div><div class="v num">${fmt(61240.5)}</div></div>
      <div class="card"><div class="small muted">排名</div><div class="v num">#37</div></div>
    </div>
    <div class="card"><h3>持股</h3>${rows}</div>
    <div class="card"><h3>成交紀錄</h3><div class="scroll"><table><thead><tr><th class="l">時間</th><th class="l">女優</th><th>買賣</th><th>股數</th><th>均價</th><th>手續費</th><th>金額</th></tr></thead><tbody>${trades}</tbody></table></div></div>
  </div></div>`;
}

function leaderboardPage() {
  const names2 = ["ねこ投資部", "匿名#4821", "しずか", "匿名#0937", "無敵の株主", "匿名#7710", "推し活ファンド", "匿名#3302", "まゆ", "匿名#5519"];
  let v = 182340;
  const rows = names2.map((n, i) => { v *= 0.93; return `<tr><td class="rank">${i + 1}</td><td class="l">${n}</td><td class="num">${fmt(v + 12000, 0)}</td><td class="num up">+${fmt((v + 12000) / 1000 - 100)}%</td><td class="l">${stocks[(i * 3) % 20].name}</td></tr>`; }).join("");
  const me = S.acct === "google" ? `<tr class="me"><td class="rank">37</td><td class="l"><b>你</b></td><td class="num">${fmt(105220.7, 0)}</td><td class="num up">+5.22%</td><td class="l">${stocks[0].name}</td></tr>` : "";
  return crumb(["股市", "排行榜"]) + `<div class="page"><div class="url">/market/leaderboard</div>
    <div class="card"><div class="tabs"><span class="chip on">總資產</span><span class="chip">本週報酬</span></div><div class="scroll"><table><thead><tr><th>名次</th><th class="l">暱稱</th><th>總資產</th><th>報酬率</th><th class="l">最大持股</th></tr></thead><tbody>${me}${rows}</tbody></table></div></div></div>`;
}

function render() {
  const f = document.getElementById("frame");
  f.className = "frame" + (S.dark ? " dark" : "") + (S.mobile ? " mobile" : "");
  const body = { market: marketPage, stock: stockPage, portfolio: portfolioPage, leaderboard: leaderboardPage }[S.page]();
  f.innerHTML = header() + body + `<div class="footer">joyu.fyi</div>`;
  document.querySelectorAll("[data-page]").forEach(b => b.classList.toggle("on", b.dataset.page === S.page));
  document.querySelectorAll("[data-acct]").forEach(b => b.classList.toggle("on", b.dataset.acct === S.acct));
  document.querySelectorAll("[data-st]").forEach(b => b.classList.toggle("on", b.dataset.st === S.st));
  document.getElementById("dark").classList.toggle("on", S.dark);
  document.getElementById("mobile").classList.toggle("on", S.mobile);
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-page],[data-acct],[data-st],[data-sort],[data-side],[data-go],#dark,#mobile");
  if (!t) return;
  if (t.dataset.page) S.page = t.dataset.page;
  if (t.dataset.acct) S.acct = t.dataset.acct;
  if (t.dataset.st) { S.st = t.dataset.st; if (S.st === "t1") S.side = "sell"; if (S.st === "limitup") S.side = "buy"; }
  if (t.dataset.sort) S.sort = t.dataset.sort;
  if (t.dataset.side) S.side = t.dataset.side;
  if (t.dataset.go) S.page = t.dataset.go;
  if (t.id === "dark") S.dark = !S.dark;
  if (t.id === "mobile") S.mobile = !S.mobile;
  seed = 7; // 每次重畫都用同一組亂數，切換狀態時資料不會跳
  render();
});
render();
</script>
</body>
</html>
