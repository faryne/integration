<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joyu.fyi 廣告版位 mockup</title>
<style>
  :root {
    --plum:#2b1d2e; --plum-deep:#1c1420; --pink:#ff5c8a; --pink-strong:#ff5c8a;
    --bg:#17111a; --paper:#221a25; --line:#3a2e3d; --text:#f3e6ef; --muted:#b39fb0; --chip:#2e2431;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:#cfc6cd; }
  .toolbar { position:sticky; top:0; z-index:40; background:#111; color:#fff; padding:10px 16px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .toolbar button { background:#3a3a3a; color:#fff; border:0; border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .toolbar button.on { background:var(--pink); }
  .toolbar .sep { width:1px; height:20px; background:#555; margin:0 4px; }
  .toolbar .label { color:#aaa; margin-right:2px; }
  .stage { padding:24px; display:flex; overflow-x:auto; }
  .frame { margin:0 auto; background:var(--bg); color:var(--text); border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.25); width:1180px; flex:0 0 auto; }
  .frame.mobile { width:375px; }
  .header { background:var(--plum); height:56px; display:flex; align-items:center; gap:18px; padding:0 20px; border-bottom:1px solid var(--line); }
  .brand { font-weight:800; color:var(--text); }
  .brand b { color:var(--pink); }
  .nav { display:flex; gap:14px; font-size:14px; color:#e7d5e1; }
  .mobile .nav { gap:8px; font-size:13px; }
  .mobile .header { padding:0 10px; gap:8px; }
  .crumb { padding:8px 20px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); }
  .page { padding:20px; }
  .mobile .page { padding:16px; }
  .note { background:#3a3218; color:#f1d77a; border:1px solid #6b5a1f; border-radius:8px; padding:8px 12px; font-size:12px; margin-bottom:16px; line-height:1.7; }
  section { margin-bottom:28px; }
  h2 { margin:0 0 12px; font-size:18px; }
  .ph { background:repeating-linear-gradient(45deg,#3a2e3d 0 10px,#443748 10px 20px); border-radius:8px; }
  .row { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px; }
  .mobile .row { grid-template-columns:repeat(3, minmax(0,1fr)); }
  .row .ph { aspect-ratio:3/4; }
  .circle { border-radius:50%; aspect-ratio:1; }
  .hero { padding:28px; border-radius:12px; background:linear-gradient(135deg,#3a2140,#1c1420); margin-bottom:28px; }
  .hero h1 { margin:0 0 12px; font-size:26px; }
  .search { background:#fff; border-radius:10px; padding:12px 16px; color:#888; max-width:640px; }

  /* 廣告版位：PC 728×90、手機 300×100，置中，上方小字「廣告」 */
  .ad { display:flex; flex-direction:column; align-items:center; margin:4px 0 28px; }
  .ad .tag { font-size:10px; color:var(--muted); letter-spacing:.1em; margin-bottom:4px; align-self:center; }
  .ad .slot { width:728px; height:90px; max-width:100%; border-radius:6px; display:grid; place-items:center; font-size:13px; }
  .mobile .ad .slot { width:300px; height:100px; }
  .ad.loaded .slot { background:linear-gradient(90deg,#ff7aa2,#7a4a8a); color:#fff; font-weight:800; }
  .ad.loading .slot { background:var(--paper); border:1px dashed var(--line); color:var(--muted); }
  .ad.blocked-collapse { display:none; }
  .ad.blocked-house .slot { background:var(--paper); border:1px solid var(--line); color:var(--text); justify-content:space-between; display:flex; align-items:center; padding:0 20px; gap:12px; }
  .ad.blocked-house .tag { visibility:hidden; }
  .house b { color:var(--pink); }
  .house .go { font-size:12px; color:var(--pink); white-space:nowrap; }
  .house .info { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1 1 auto; }
  .house .kicker { font-size:11px; color:var(--muted); }
  .house .title { font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .house .faces { display:flex; gap:6px; }
  .house .face { width:56px; height:56px; border-radius:50%; background:repeating-linear-gradient(45deg,#7a4a8a 0 6px,#8f5a9f 6px 12px); border:2px solid var(--pink); flex:0 0 auto; }
  .mobile .house { padding:0 12px; }
  .mobile .house .title { font-size:14px; }
  .mobile .house .face { width:36px; height:36px; }
  /* 手機 300 寬放不下「看主題 →」，整格本來就可點，箭頭拿掉 */
  .mobile .house .go { display:none; }
  .mobile .house .faces { gap:4px; }

  .profile { display:grid; grid-template-columns:200px 1fr; gap:20px; margin-bottom:20px; }
  .mobile .profile { grid-template-columns:110px 1fr; gap:12px; }
  .profile .ph { aspect-ratio:3/4; }
  .facts { display:grid; grid-template-columns:repeat(4,auto); gap:6px 28px; justify-content:start; font-size:13px; color:var(--muted); margin-top:10px; }
  .mobile .facts { grid-template-columns:1fr 1fr; }
  .tabs { display:flex; gap:18px; border-bottom:1px solid var(--line); margin-bottom:16px; font-size:14px; }
  .tabs span { padding:10px 2px; color:var(--muted); }
  .tabs span.on { color:var(--pink); border-bottom:2px solid var(--pink); }
  .vtop { display:grid; grid-template-columns:420px 1fr; gap:24px; margin-bottom:20px; }
  .mobile .vtop { grid-template-columns:1fr; }
  .vtop .ph { aspect-ratio:3/4; }
  .meta { font-size:13px; line-height:2; color:var(--muted); }
  .chip { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:12px; padding:2px 10px; margin:0 4px 4px 0; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div class="toolbar">
  <span class="label">頁面</span>
  <button data-page="home" class="on">首頁</button>
  <button data-page="actress">女優頁</button>
  <button data-page="video">影片頁</button>
  <span class="sep"></span>
  <span class="label">寬度</span>
  <button data-width="desktop" class="on">PC（728×90）</button>
  <button data-width="mobile">手機（300×100）</button>
  <span class="sep"></span>
  <span class="label">廣告狀態</span>
  <button data-ad="loaded" class="on">正常顯示</button>
  <button data-ad="loading">載入中</button>
  <button data-ad="blocked-house">被擋：換站內推廣（採用）</button>
  <button data-ad="blocked-collapse">被擋：整格收起（不採用）</button>
</div>

<div class="stage"><div class="frame" id="frame">
  <div class="header"><div class="brand"><b>女</b> joyu.fyi</div><div class="nav"><span>女優</span><span>女優主題</span><span>影片</span><span>即將發售</span></div></div>
  <div class="crumb" id="crumb"></div>
  <div class="page">
    <div class="note" id="note"></div>

    <!-- 首頁 -->
    <div data-sec="home">
      <div class="hero"><h1>找女優、找作品</h1><div class="search">輸入名字、別名，或直接貼番號</div></div>
      <section><h2>今天有新片的女優</h2><div class="row" id="r1"></div></section>
      <div class="ad" data-ad-slot></div>
      <section><h2>近期生日</h2><div class="row" id="r2"></div></section>
      <section><h2>女優主題</h2><div class="ph" style="height:120px"></div></section>
      <div class="ad" data-ad-slot></div>
      <section><h2>即將發售</h2><div class="row" id="r3"></div></section>
      <section><h2>最新上架影片</h2><div class="row" id="r4"></div></section>
    </div>

    <!-- 女優頁 -->
    <div data-sec="actress">
      <div class="profile">
        <div class="ph"></div>
        <div><h1 style="margin:0;font-size:24px">波多野結衣 ♡</h1><div style="color:var(--muted);font-size:13px">はたの ゆい</div>
          <div class="facts"><div>生日 1988/5/24</div><div>身高 163 cm</div><div>三圍 88/59/85</div><div>2008 年・4,457 部</div></div></div>
      </div>
      <div class="ad" data-ad-slot></div>
      <div class="tabs"><span class="on">作品</span><span>共演女優（12）</span><span>討論（3）</span></div>
      <div class="row" id="r5"></div>
    </div>

    <!-- 影片頁 -->
    <div data-sec="video">
      <div class="vtop">
        <div class="ph"></div>
        <div><h1 style="margin:0 0 8px;font-size:22px">RLMP-028 気は強いのに乳首最弱…</h1>
          <div><span class="chip">配信日 2026/11/07</span><span class="chip">125 分鐘</span></div>
          <div class="meta">出演 波多野結衣<br>發售商 レアルワークス<br>標籤 女上司・中出し・単体作品</div></div>
      </div>
      <div class="ad" data-ad-slot></div>
      <div class="tabs"><span class="on">圖片預覽</span><span>討論</span><span>同系列作品</span><span>波多野結衣 的其他作品</span></div>
      <div class="ph" style="height:360px"></div>
    </div>
  </div>
</div></div>

<script>
const notes = {
  home: "首頁兩個版位：「今天有新片的女優」之後、「女優主題」之後（即將發售之前）。不放在主視覺搜尋框旁邊，避免第一屏就被廣告佔掉。",
  actress: "女優頁：頂端資料區與「作品／共演女優／討論」分頁之間。",
  video: "影片頁：封面＋資料區與分頁（圖片預覽…）之間。",
};
const adNotes = {
  loaded: "廣告正常顯示：上方一行小字「廣告」，版位置中、寬高固定（PC 728×90、手機 300×100）。",
  loading: "載入中：先保留固定大小的空框（虛線），廣告進來時版面不會跳動。",
  "blocked-collapse": "被 adblock 擋掉（做法一）：整格收起來，連「廣告」小字都不留。缺點：保留的高度消失，下面的內容會往上跳一次。",
  "blocked-house": "被 adblock 擋掉（採用）：同一個大小的框改放站內推廣，內容從女優主題隨機挑一個（主題名稱、人數、作品最多的幾位女優頭像，點了到主題頁）；之後的影片主題也會加進來。不顯示「廣告」字樣、不要求關掉 adblock，版面不跳動。",
};
const crumbs = { home: "", actress: "joyu.fyi ／ 女優 ／ 波多野結衣", video: "joyu.fyi ／ 影片 ／ RLMP-028" };
let page = "home", ad = "loaded", houseIndex = 0;
const TOPICS = [
  { label: "巨乳", count: 1243 }, { label: "人妻", count: 862 }, { label: "新人", count: 318 },
  { label: "高身長 170cm 以上", count: 156 }, { label: "11 月壽星", count: 94 },
];

function adHTML() {
  const mobile = document.getElementById("frame").classList.contains("mobile");
  const size = mobile ? "300×100" : "728×90";
  if (ad === "loaded") return `<div class="tag">廣告</div><div class="slot">廣告素材 ${size}</div>`;
  if (ad === "loading") return `<div class="tag">廣告</div><div class="slot"></div>`;
  if (ad === "blocked-house") {
    // 站內推廣：隨機一個女優主題，顯示主題名稱、人數與作品最多的幾位女優頭像（PC 6 位、手機 3 位）
    const t = TOPICS[houseIndex % TOPICS.length];
    const faces = Array.from({ length: mobile ? 3 : 6 }, () => '<span class="face"></span>').join("");
    return `<div class="tag">廣告</div><div class="slot house"><span class="info"><span class="kicker">女優主題</span><span class="title">${t.label}・<b>${t.count.toLocaleString()}</b> 位</span></span><span class="faces">${faces}</span><span class="go">看主題 →</span></div>`;
  }
  return "";
}

function render() {
  document.querySelectorAll("[data-sec]").forEach((el) => el.classList.toggle("hide", el.dataset.sec !== page));
  document.getElementById("crumb").textContent = crumbs[page];
  document.getElementById("crumb").classList.toggle("hide", !crumbs[page]);
  document.getElementById("note").textContent = notes[page] + "　" + adNotes[ad];
  // 同一頁的多個版位各自挑不同主題
  document.querySelectorAll("[data-ad-slot]").forEach((el, i) => { houseIndex = i + page.length; el.className = "ad " + ad; el.innerHTML = adHTML(); });
  for (const [id, n, circle] of [["r1", 6, true], ["r2", 6, true], ["r3", 6], ["r4", 6], ["r5", 6]]) {
    document.getElementById(id).innerHTML = Array.from({ length: n }, () => `<div class="ph ${circle ? "circle" : ""}"></div>`).join("");
  }
}
const group = (attr, fn) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => (b.onclick = () => {
  document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.classList.toggle("on", x === b)); fn(b.dataset[attr]); render();
}));
group("page", (v) => (page = v));
group("ad", (v) => (ad = v));
group("width", (v) => document.getElementById("frame").classList.toggle("mobile", v === "mobile"));
render();
</script>
</body>
</html>
