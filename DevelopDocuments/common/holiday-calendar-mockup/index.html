<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>通用日曆元件 Mockup</title>
<style>
/* 色票沿用其他 mockup；只示意元件本身，不含頁面外框 */
:root { color-scheme: dark; --bg:#0d0f14; --paper:#151820; --paper-2:#1b1f29; --paper-3:#232834; --text:#f1f2f6; --muted:#9aa2b1; --disabled:#687080; --line:#2d3340; --primary:#aa91ff; --primary-soft:rgba(170,145,255,.14); --holiday:#ff7f8b; --holiday-soft:rgba(255,127,139,.12); --work:#f4bd67; --work-soft:rgba(244,189,103,.14); }
html[data-theme="light"] { color-scheme: light; --bg:#f5f6fa; --paper:#fff; --paper-2:#f9f9fc; --paper-3:#eff1f6; --text:#20232b; --muted:#687080; --disabled:#979eaa; --line:#dfe2e9; --primary:#6951bd; --primary-soft:rgba(105,81,189,.11); --holiday:#c83f50; --holiday-soft:rgba(200,63,80,.08); --work:#a96712; --work-soft:rgba(169,103,18,.1); }
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, "Noto Sans TC", -apple-system, sans-serif; background:var(--bg); color:var(--text); }
button { font: inherit; color: inherit; cursor: pointer; }
.bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:space-between; padding:10px 16px; background:#101219; border-bottom:1px solid #2d3340; color:#f1f2f6; }
.bar span { color:#9aa2b1; font-size:12px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { border:1px solid #3c4351; border-radius:8px; padding:6px 9px; background:#1a1e27; color:#dfe2e9; font-size:12px; }
.chip.active { color:#d9d0ff; border-color:#7561c6; background:rgba(170,145,255,.16); }
.stage { padding:24px 16px; display:grid; justify-items:center; gap:16px; }
.frame { width:min(860px,100%); display:grid; gap:14px; }
body[data-view="mobile"] .frame { width:390px; }

/* ===== 元件本體 ===== */
.cal { background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); }
.cal-title { display:flex; align-items:center; gap:4px; }
.cal-title h2 { margin:0 6px; font-size:17px; min-width:118px; text-align:center; }
.icon { width:32px; height:32px; border:0; border-radius:8px; background:transparent; color:var(--muted); font-size:18px; }
.icon:hover { background:var(--paper-3); color:var(--text); }
.icon:disabled { opacity:.3; cursor:default; }
.today-btn { border:1px solid var(--line); border-radius:7px; padding:5px 10px; background:var(--paper); font-size:12px; font-weight:700; }
.legend { display:flex; gap:12px; font-size:11.5px; color:var(--muted); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
.week { display:grid; grid-template-columns:repeat(7,1fr); background:var(--paper-2); border-bottom:1px solid var(--line); }
.week div { padding:7px 0; text-align:center; font-size:12px; font-weight:700; color:var(--muted); }
.week div:first-child, .week div:last-child { color:var(--holiday); }
.grid { display:grid; grid-template-columns:repeat(7,1fr); }
.day { position:relative; min-height:84px; padding:6px 7px; border:0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper); text-align:left; display:flex; flex-direction:column; gap:3px; }
.day:nth-child(7n) { border-right:0; }
.day:hover { background:var(--paper-2); }
.day .num { font-size:14px; font-weight:800; width:26px; height:26px; display:grid; place-items:center; border-radius:50%; }
.day .note { font-size:11px; line-height:1.35; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.day.holiday { background:var(--holiday-soft); }
.day.holiday .num, .day.holiday .note { color:var(--holiday); }
.day.makeup { background:var(--work-soft); }
.day.makeup .badge { position:absolute; top:7px; right:6px; font-size:10px; font-weight:800; color:var(--work); border:1px solid currentColor; border-radius:999px; padding:0 5px; }
.day.unknown .num { color:var(--disabled); }
.day.outside { opacity:.35; }
.day.today .num { box-shadow:inset 0 0 0 2px var(--primary); }
.day.selected { box-shadow:inset 0 0 0 2px var(--primary); }
/* disabled：保留放假／補班底色但整格變淡、加斜線，滑鼠不可點 */
.day.disabled { cursor:not-allowed; opacity:.45; background-image:repeating-linear-gradient(135deg, transparent 0 6px, var(--line) 6px 7px); }
.day.disabled:hover { background-color:inherit; }
.day.disabled .num { text-decoration:line-through; }
body[data-view="mobile"] .day { min-height:58px; padding:4px; align-items:center; }
body[data-view="mobile"] .day .note { font-size:9.5px; text-align:center; -webkit-line-clamp:1; }
body[data-view="mobile"] .day.makeup .badge { position:static; font-size:9px; }
body[data-view="mobile"] .legend { display:none; }
.state { padding:42px 16px; text-align:center; color:var(--muted); font-size:13px; }
.alert { margin:12px; padding:11px 13px; border:1px solid color-mix(in srgb,var(--holiday) 45%,var(--line)); border-radius:8px; background:var(--holiday-soft); color:var(--holiday); font-size:13px; }
.spinner { width:26px; height:26px; margin:0 auto 10px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* mockup 用：顯示 onClick 收到的內容 */
.log { background:var(--paper); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--muted); }
.log code { display:block; margin-top:6px; white-space:pre-wrap; color:var(--text); font-family:ui-monospace,Menlo,monospace; font-size:12px; }
.snack { position:fixed; right:20px; bottom:20px; padding:12px 14px; border-radius:8px; background:#9f3040; color:#fff; font-size:13px; display:none; }
.snack.show { display:block; }
</style>
</head>
<body>
<header class="bar">
  <div><strong>通用日曆元件 Mockup</strong> <span>116 年人事行政總處真實資料 · 只示意元件本身</span></div>
  <div class="chips">
    <button class="chip active" data-src="csv">csvUrl（經後端代理）</button>
    <button class="chip" data-src="loading">載入中</button>
    <button class="chip" data-src="error">csvUrl 失敗</button>
    <button class="chip active" id="toggleDisabled">disabled 示意：開</button>
    <span style="width:1px;background:#3c4351"></span>
    <button class="chip active" data-view="desktop">Desktop</button>
    <button class="chip" data-view="mobile">Mobile 390</button>
    <button class="chip" id="theme">切換深淺色</button>
  </div>
</header>
<main class="stage">
  <div class="frame">
    <section class="cal" aria-label="行事曆">
      <div class="cal-head">
        <div class="cal-title">
          <button class="icon" id="prev" aria-label="上個月">‹</button>
          <h2 id="title"></h2>
          <button class="icon" id="next" aria-label="下個月">›</button>
        </div>
        <div class="legend">
          <span><i style="background:var(--holiday-soft);border:1px solid var(--holiday)"></i>放假</span>
          <span><i style="background:var(--work-soft);border:1px solid var(--work)"></i>補班</span>
          <span><i style="border:1px solid var(--line)"></i>上班</span>
        </div>
        <button class="today-btn" id="today">今天</button>
      </div>
      <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div id="body"></div>
    </section>
    <div class="log">onClick(date, day) 收到：<code id="log">（點任一天）</code></div>
    <div class="log">disabled = () =&gt; [new Date(2027, 1, 11), new Date(2027, 1, 12), new Date(2027, 1, 24)]（2/11、2/12、2/24 不可點）</div>
  </div>
</main>
<div class="snack" id="snack">無法取得人事行政總處行事曆，請稍後再試。</div>

DATA.push({ date: "2027-02-20", isHoliday: false, note: "補行上班（示意）" });
const byDate = new Map(DATA.map((d) => [d.date, d]));
const range = [DATA[0].date.slice(0, 7), "2027-12"];
let month = new Date(2027, 0, 1), selected = null, src = "csv", disabledOn = true;
// disabled prop 示意：回傳要停用的日期陣列，元件只比對「年月日」，忽略時分秒與時區時間
const disabled = () => [new Date(2027, 1, 11, 9, 30), new Date(2027, 1, 12), new Date(2027, 1, 24)];
const $ = (s) => document.querySelector(s);
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ym = (d) => iso(d).slice(0, 7);

function render() {
  $("#title").textContent = `${month.getFullYear()} 年 ${month.getMonth() + 1} 月`;
  $("#prev").disabled = ym(month) <= range[0];
  $("#next").disabled = ym(month) >= range[1];
  if (src === "loading") return ($("#body").innerHTML = '<div class="state"><div class="spinner"></div>正在取得行事曆…</div>');
  if (src === "error") return ($("#body").innerHTML = '<div class="alert">無法取得人事行政總處行事曆（csvUrl），請稍後再試。</div>');
  const disabledKeys = new Set(disabledOn ? disabled().map(iso) : []);
  // 6 週固定高度，從當月 1 號所在週的週日開始
  const start = new Date(month.getFullYear(), month.getMonth(), 1 - month.getDay());
  let html = '<div class="grid">';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = iso(d), info = byDate.get(key), weekend = d.getDay() === 0 || d.getDay() === 6;
    const cls = ["day", d.getMonth() !== month.getMonth() && "outside", !info && "unknown",
      info?.isHoliday && "holiday", info && !info.isHoliday && weekend && "makeup",
      key === iso(new Date()) && "today", key === selected && "selected", disabledKeys.has(key) && "disabled"].filter(Boolean).join(" ");
    html += `<button class="${cls}" data-date="${key}"${disabledKeys.has(key) ? ' aria-disabled="true" data-disabled="1"' : ""}><span class="num">${d.getDate()}</span>${info && !info.isHoliday && weekend ? '<span class="badge">補班</span>' : ""}${info?.note ? `<span class="note">${info.note}</span>` : ""}</button>`;
  }
  $("#body").innerHTML = html + "</div>";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.disabled) return; // disabled 的日期不觸發 onClick
  if (b.id === "toggleDisabled") { disabledOn = !disabledOn; b.classList.toggle("active", disabledOn); b.textContent = `disabled 示意：${disabledOn ? "開" : "關"}`; return render(); }
  if (b.dataset.date) {
    selected = b.dataset.date;
    const day = byDate.get(selected);
    $("#log").textContent = `date = new Date("${selected}")\nday  = ${day ? JSON.stringify(day) : "undefined（資料範圍外）"}`;
    // 點到上下月的日期，順便切過去
    const d = new Date(selected);
    if (d.getMonth() !== month.getMonth()) month = new Date(d.getFullYear(), d.getMonth(), 1);
    return render();
  }
  if (b.id === "prev" || b.id === "next") { month = new Date(month.getFullYear(), month.getMonth() + (b.id === "prev" ? -1 : 1), 1); return render(); }
  if (b.id === "today") { month = new Date(new Date().getFullYear(), new Date().getMonth(), 1); return render(); }
  if (b.id === "theme") { const h = document.documentElement; h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark"; return; }
  if (b.dataset.view) { document.body.dataset.view = b.dataset.view; document.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("active", x === b)); return; }
  if (b.dataset.src) {
    src = b.dataset.src;
    document.querySelectorAll("[data-src]").forEach((x) => x.classList.toggle("active", x === b));
    $("#snack").classList.toggle("show", src === "error");
    setTimeout(() => $("#snack").classList.remove("show"), 3000);
    return render();
  }
});
