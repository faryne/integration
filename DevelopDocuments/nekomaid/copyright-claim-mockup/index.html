<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>版權申告 Mockup</title>
<style>
  /* 色彩 token：對齊 MUI 預設主題，深色模式跟著系統 */
  :root {
    --bg: #f5f6f8; --paper: #fff; --text: #1f2328; --muted: #667085; --line: #e3e6ea;
    --primary: #1976d2; --primary-soft: #e8f1fb; --error: #d32f2f; --warn: #ed6c02; --ok: #2e7d32;
    --selected: rgba(25,118,210,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --paper: #1b1e23; --text: #e6e8eb; --muted: #9aa3ae; --line: #2c3138;
      --primary: #64a8f0; --primary-soft: #1d2b3b; --selected: rgba(100,168,240,.14);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Noto Sans TC", "PingFang TC", system-ui, sans-serif; }
  button, input, textarea { font: inherit; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar { height: 56px; display: flex; align-items: center; padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line); font-weight: 900; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .crumbs { color: var(--muted); font-size: 13px; margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .crumbs .cur { color: var(--text); }

  /* 作品頁：左圖右資訊面板 */
  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 480px); gap: 16px; align-items: start; }
  .image { aspect-ratio: 3 / 4; border-radius: 12px; background: linear-gradient(135deg, #f6c6d6, #b9c9f5); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 48px; font-weight: 900; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--selected); border: 1px solid var(--line); }
  .chip.warn { border-color: var(--warn); color: var(--warn); background: none; }
  .chip.ok { border-color: var(--ok); color: var(--ok); background: none; }
  .chip.err { border-color: var(--error); color: var(--error); background: none; }
  h2 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 900; }
  .by { color: var(--muted); margin-top: 6px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--primary); color: var(--primary); background: none; border-radius: 6px; padding: 6px 14px; font-weight: 700; cursor: pointer; }
  .btn.contained { background: var(--primary); color: #fff; }
  .btn.text { border-color: transparent; color: var(--muted); padding: 6px 8px; }
  .btn.text:hover { color: var(--text); background: var(--selected); }
  .btn:disabled { opacity: .5; cursor: default; }
  .new { outline: 2px dashed var(--warn); outline-offset: 3px; border-radius: 6px; }

  /* 對話框 */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .scrim.open { display: flex; }
  .dialog { background: var(--paper); border-radius: 12px; width: 100%; max-width: 520px; padding: 24px; max-height: calc(100vh - 32px); overflow: auto; }
  .dialog h3 { margin: 0 0 16px; font-size: 20px; }
  .form { display: grid; gap: 14px; }
  .form label.f { display: grid; gap: 4px; font-weight: 700; font-size: 13px; }
  .input { border: 1px solid var(--line); background: var(--paper); color: var(--text); border-radius: 6px; padding: 10px 12px; width: 100%; }
  textarea.input { min-height: 120px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
  legend { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .radio { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .radio:has(input:checked) { border-color: var(--primary); background: var(--selected); }
  .hp { position: absolute; left: -9999px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .done { text-align: center; display: grid; gap: 12px; }
  .done .mark { font-size: 40px; color: var(--ok); }
  .copy { display: flex; gap: 6px; }
  .copy .input { font-size: 12px; }

  /* 處理結果列表：/copyright-claim（全部）與 /copyright-claim/:hash（同一 IP 送出的） */
  .claims { max-width: 880px; margin: 0 auto; display: grid; gap: 12px; }
  .claims h1 { margin: 0; font-size: 22px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .claim { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
  .claim .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
  .claim .meta { color: var(--muted); font-size: 13px; }
  .pager { display: flex; justify-content: center; gap: 8px; padding: 8px; }
  .empty { padding: 40px 12px; text-align: center; color: var(--muted); }

  /* 查詢頁 */
  .status-card { max-width: 560px; margin: 24px auto; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 16px; }
  .status-card h1 { margin: 0; font-size: 22px; }
  dl { display: grid; grid-template-columns: 96px 1fr; gap: 8px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .reason { border-left: 3px solid var(--error); padding: 8px 12px; background: var(--selected); border-radius: 4px; }

  .snack { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--error); color: #fff; padding: 10px 18px; border-radius: 6px; transition: transform .2s; z-index: 60; }
  .snack.show { transform: translateX(-50%) translateY(0); }

  /* Mockup 專用的狀態切換面板（實作時不會有） */
  .switcher { position: fixed; right: 16px; bottom: 16px; z-index: 70; background: #222; color: #fff; border-radius: 10px; padding: 10px; font-size: 12px; max-width: 260px; }
  .switcher b { display: block; margin-bottom: 6px; }
  .switcher button { background: #3a3a3a; color: #fff; border: 0; border-radius: 4px; padding: 4px 8px; margin: 2px; font-size: 12px; cursor: pointer; }
  .switcher button.on { background: #1976d2; }

  @media (max-width: 899px) {
    .viewer { grid-template-columns: minmax(0, 1fr); }
    h2 { font-size: 24px; }
    .switcher { left: 16px; right: 16px; max-width: none; bottom: 8px; }
    .wrap { padding-bottom: 140px; }
  }
</style>
</head>
<body>
<div class="topbar">neko.maid.tw</div>

<!-- 作品頁 -->
<div class="wrap" id="artworkPage">
  <div class="crumbs"><a href="#">首頁</a><span>/</span><a href="#">pixiv</a><span>/</span><a href="#">しらたま</a><span>/</span><span class="cur">夏のメイドさん</span></div>
  <div class="viewer">
    <div class="image">🖼</div>
    <div class="panel">
      <div class="chips"><span class="chip">pixiv</span><span class="chip">漫畫（共3張）</span></div>
      <div>
        <h2>夏のメイドさん</h2>
        <div class="by">by <a href="#">しらたま</a> / 作者 ID：82517969</div>
      </div>
      <div class="btns">
        <button class="btn contained">圖片原始頁 ↗</button>
        <button class="btn">畫師頁面</button>
        <button class="btn">同畫師作品</button>
        <button class="btn">分享</button>
        <!-- 新增：版權申告入口，用低調的文字按鈕 -->
        <button class="btn text new" data-act="open">⚑ 版權申告</button>
      </div>
      <div class="chips"><span class="chip">メイド</span><span class="chip">オリジナル</span><span class="chip">夏</span></div>
    </div>
  </div>
</div>

<!-- 處理結果：/copyright-claim（全部）、/copyright-claim/:hash（同一 IP 送出的）；不顯示 email、IP、說明 -->
<div class="wrap" id="claimsPage" hidden>
  <div class="crumbs"><a href="#">首頁</a><span>/</span><a href="#" data-act="allClaims" id="crumbAll">版權申告</a><span id="crumbMineSep">/</span><span class="cur" id="crumbCur">你送出的申告</span></div>
  <div class="claims">
    <h1 id="claimsTitle">版權申告處理結果</h1>
    <div class="tabs">
      <button class="tab active" data-filter="">全部</button>
      <button class="tab" data-filter="pending">審核中</button>
      <button class="tab" data-filter="approved">已核准</button>
      <button class="tab" data-filter="rejected">已駁回</button>
    </div>
    <div id="claimList"></div>
    <div class="pager"><button class="btn" disabled>上一頁</button><span class="meta" style="align-self:center">1 / 1</span><button class="btn" disabled>下一頁</button></div>
  </div>
</div>

<!-- 申告對話框 -->
<div class="scrim" id="dialog">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div id="formView">
      <h3 id="dialogTitle">版權申告</h3>
      <div class="form">
        <fieldset>
          <legend>申告範圍</legend>
          <label class="radio"><input type="radio" name="scope" value="artwork" checked><span>只有這件作品「夏のメイドさん」</span></label>
          <label class="radio"><input type="radio" name="scope" value="author"><span>しらたま 的所有作品</span></label>
        </fieldset>
        <label class="f">聯絡 email（選填）<input class="input" type="email" id="email" autocomplete="email"></label>
        <label class="f">說明（選填）<textarea class="input" id="message" maxlength="2000"></textarea></label>
        <!-- honeypot：畫面上看不到，機器人才會填 -->
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </div>
      <div class="actions">
        <button class="btn text" data-act="close">取消</button>
        <button class="btn contained" data-act="submit">送出</button>
      </div>
    </div>
    <div id="doneView" class="done" hidden>
      <div class="mark">✓</div>
      <h3 style="margin:0">已收到申告</h3>
      <div class="copy">
        <input class="input" id="statusUrl" readonly value="https://neko.maid.tw/copyright-claim/360920343454023421462b1a3a9bec19">
        <button class="btn" data-act="copy">複製</button>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" data-act="viewMine">查看我送出的申告</button>
        <button class="btn contained" data-act="close">關閉</button>
      </div>
    </div>
  </div>
</div>
<div class="snack" id="snack"></div>

<div class="switcher">
  <b>Mockup 狀態</b>
  <div>作品頁：
    <button data-state="form" class="on">申告表單</button>
    <button data-state="submitError">送出失敗</button>
    <button data-state="limited">太頻繁</button>
  </div>
  <div>處理結果：
    <button data-state="all">全部申告</button>
    <button data-state="mine">我送出的（:hash）</button>
    <button data-state="mineEmpty">hash 查無資料</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = "form";
// 公開欄位：不含 email、IP、說明；駁回才顯示理由
const claims = [
  { id: 12, site: "pixiv", author_id: "82517969", nickname: "しらたま", artwork_id: "", title: "", status: "pending", created_at: "2026-11-05 09:12", mine: true },
  { id: 11, site: "pixiv", author_id: "82517969", nickname: "しらたま", artwork_id: "145304494", title: "夏のメイドさん", status: "approved", created_at: "2026-11-04 15:20", reviewed_at: "2026-11-04 18:02", mine: true },
  { id: 9, site: "nico", author_id: "3392811", nickname: "", artwork_id: "", title: "", status: "approved", created_at: "2026-11-03 10:00", reviewed_at: "2026-11-03 12:30" },
  { id: 7, site: "pixiv", author_id: "777", nickname: "某畫師", artwork_id: "", title: "", status: "rejected", note: "非畫師本人或權利人", created_at: "2026-10-29 18:30", reviewed_at: "2026-10-30 09:00" },
];
const statusChip = { pending: '<span class="chip warn">審核中</span>', approved: '<span class="chip ok">已核准，停止收錄</span>', rejected: '<span class="chip err">已駁回</span>' };
let mineOnly = false, mineEmpty = false, filter = "";

function renderClaims() {
  $("claimsTitle").textContent = mineOnly ? "你送出的申告" : "版權申告處理結果";
  $("crumbMineSep").hidden = $("crumbCur").hidden = !mineOnly;
  const data = mineEmpty ? [] : claims.filter((c) => (!mineOnly || c.mine) && (!filter || c.status === filter));
  $("claimList").innerHTML = data.length ? data.map((c) => `
    <div class="claim">
      <div class="head"><b>#${c.id}・${c.nickname || c.author_id}</b>${statusChip[c.status]}</div>
      <div>${c.site}・${c.artwork_id ? `作品 <a href="#">${c.title || c.artwork_id}</a>` : `<a href="#">整個畫師</a>`}</div>
      ${c.status === "rejected" && c.note ? `<div class="reason">${c.note}</div>` : ""}
      <div class="meta">送出 ${c.created_at}${c.reviewed_at ? `・審核 ${c.reviewed_at}` : ""}</div>
    </div>`).join("") : `<div class="empty">沒有申告</div>`;
}

function showClaims(mine, empty) {
  mineOnly = mine; mineEmpty = empty; filter = "";
  document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("active", b.dataset.filter === ""));
  $("artworkPage").hidden = true; $("claimsPage").hidden = false; $("dialog").classList.remove("open");
  renderClaims();
}

function snack(msg) {
  const s = $("snack"); s.textContent = msg; s.classList.add("show");
  clearTimeout(snack.t); snack.t = setTimeout(() => s.classList.remove("show"), 2600);
}

function showArtwork() {
  $("artworkPage").hidden = false; $("claimsPage").hidden = true;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-state],[data-filter]"); if (!t) return;
  if (t.dataset.filter !== undefined) {
    filter = t.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach((b) => b.classList.toggle("active", b === t));
    renderClaims(); return;
  }
  if (t.dataset.state) {
    state = t.dataset.state;
    document.querySelectorAll("[data-state]").forEach((b) => b.classList.toggle("on", b === t));
    if (state === "all") showClaims(false, false);
    else if (state === "mine") showClaims(true, false);
    else if (state === "mineEmpty") showClaims(true, true);
    else showArtwork();
    return;
  }
  switch (t.dataset.act) {
    case "open": $("formView").hidden = false; $("doneView").hidden = true; $("dialog").classList.add("open"); break;
    case "close": $("dialog").classList.remove("open"); break;
    case "submit":
      if (state === "submitError") { snack("送出失敗，請稍後再試"); break; }
      if (state === "limited") { snack("申告次數太頻繁，請一小時後再試"); break; }
      $("formView").hidden = true; $("doneView").hidden = false; break;
    case "copy": navigator.clipboard?.writeText($("statusUrl").value); break;
    case "viewMine": showClaims(true, false); break;
    case "allClaims": e.preventDefault(); showClaims(false, false); break;
  }
});
</script>
</body>
</html>
