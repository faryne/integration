version: "3.6"

services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: "lab"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  manticore:
    image: manticoresearch/manticore
    container_name: search
    ports:
      - "9306:9306"
      - "9308:9308"
      - "9312:9312"

volumes:
  mysql_data:
